<html lang="en" data-theme="classic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>MasterClock LED</title>
  <style>
    /* ── 1. CSS Variables & Themes ────────────────────── */
    :root, html[data-theme="classic"] {
      --green:#0FFF50; --amber:#ff9100; --red:#ff3131; --precis: #b3b3b3;
      --hour-on:#00d83a; --hour-off:#14521c; --sec-off:#5d1111;
      --face-bg:#000000f3; --page-bg:#000;
      --hour-hand-w:6px; --min-hand-w:4px; --sec-hand-w:2px;
    }
    html[data-theme="cyan"] {
      --green:#00e5ff; --amber:#2979ff; --red:#ff2d78;
      --hour-on:#0091ea; --hour-off:#0d3a44; --sec-off:#4a0e22;
      --face-bg:#000d14; --page-bg:#00060a;
    }
    html[data-theme="amber"] {
      --green:#ffb300; --amber:#ff6d00; --red:#ff1744;
      --hour-on:#ff8f00; --hour-off:#3d2b00; --sec-off:#5d1015;
      --face-bg:#0a0800; --page-bg:#060500;
    }
    html[data-theme="mono"] {
      --green:#f0f0f0; --amber:#999999; --red:#ffffff;
      --hour-on:#cccccc; --hour-off:#262626; --sec-off:#262626;
      --face-bg:#0a0a0a; --page-bg:#000;
    }
    html[data-theme="vaporwave"] {
      --green:#ff2d95; --amber:#c200ff; --red:#00e0ff;
      --hour-on:#b829a8; --hour-off:#3d0a26; --sec-off:#0d3540;
      --face-bg:#0a0014; --page-bg:#050008;
    }
    html[data-theme="matrix"] {
      --green:#00ff41; --amber:#00a82b; --red:#ff0000;
      --hour-on:#00d633; --hour-off:#06210b; --sec-off:#4d0000;
      --face-bg:#000800; --page-bg:#000300;
    }

    /* ── 2. Base Layout & Reset ──────────────────────── */
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; }
    body {
      min-height:100vh; min-height:100dvh; overflow:hidden; display:grid; place-items:center;
      background:var(--page-bg); color:#ddd; font-family:monospace;
      transition:background .3s;
    }
    .clock-circle {
      position:relative; width:min(88vmin, 750px, calc(100dvh - 96px)); aspect-ratio:1; container-type:size;
      border-radius:50%; background:var(--face-bg); box-shadow:0 0 40px #030303;
      transition:border-radius .25s, width .25s, aspect-ratio .25s;
    }

    /* ── 3. Common Clock Elements ────────────────────── */
    .digital-clock, .digital-date, .countdown, .studio-mark, .signature, .precision-clock, .tz-label {
      position:absolute; left:50%; transform:translate(-50%,-50%); text-align:center; white-space:nowrap;
    }
    .digital-clock {
      top:46%; font-size:clamp(1.4rem, 13.6cqmin, 6.5rem); font-weight:400;
      color:var(--green); -webkit-text-stroke:min(1.8px,.05em) #1b1b1b;
      font-variant-numeric:tabular-nums;
    }
    .digital-clock.h12 { font-size:clamp(1.1rem, 10.8cqmin, 5.2rem); }
    .digital-date {
      z-index:2; top:35%; width:90%; white-space:normal; font-size:clamp(.6rem, 4.55cqmin, 2.2rem); font-weight:400;
      color:var(--amber); -webkit-text-stroke:min(1px,.03em) #000;
    }
    .countdown {
      top:65%; font-size:clamp(1.2rem, 7.7cqmin, 3.8rem); font-weight:400;
      color:var(--amber); -webkit-text-stroke:min(.8px,.03em) #000;
      font-variant-numeric:tabular-nums;
    }
    .studio-mark { top:20%; font-family:Verdana,sans-serif; font-size:clamp(1.4rem, 10.2cqmin, 5rem); color:#afafaff3; text-shadow:0 0 5px #bafcff; }
    .signature { bottom:14%; transform:translate(-50%,50%); color:var(--green); opacity:.55; font:clamp(.6rem,1.5cqmin,1rem)/1.2 system-ui,sans-serif; }
    .precision-clock {
      bottom:17%; transform:translate(-50%,50%); color:var(--precis); opacity:.75; font-size:clamp(.65rem,2.5cqmin,1.5rem);
      font-variant-numeric:tabular-nums;
    }
    .tz-label {
      bottom:20%; transform:translate(-50%,50%); max-width:70%;
      overflow:hidden; text-overflow:ellipsis;
      color:var(--green); opacity:.7; font-size:clamp(.50rem,2.10cqmin,1rem); letter-spacing:.04em;
    }
    .progress-bar-container {
      position:absolute; z-index:1; top:55%; left:50%; transform:translateX(-50%);
      width:70%; height:10px; border:1px solid #333333; border-radius:5px;
      overflow:hidden; background:#222;
    }
    .progress-bar-fill { width:0; height:100%; border-radius:10px 0 0 10px; background:var(--green); }
    .led, .hour-led { position:absolute; border-radius:50%; transform:translate(-50%,-50%); }
    .led { width:clamp(5px,2cqmin,20px); height:clamp(5px,2cqmin,20px); background:var(--sec-off); transition:background .15s; }
    .led.on { background:var(--red); }
    .hour-led { width:clamp(8px,2.5cqmin,30px); height:clamp(8px,2.5cqmin,30px); background:var(--hour-off); transition:background .15s; }
    .hour-led.on { background:var(--hour-on); }
    @keyframes blink-fast { 0%,49% { opacity:1; } 50%,100% { opacity:.3; } }
    .led.on.pulse-last10 { animation:blink-fast 1s infinite steps(1); }

    /* ── 4. Analog Hands ─────────────────────────────── */
    .analog-hands { display:none; position:absolute; inset:0; pointer-events:none; z-index:1; }
    #circle.variant-analog .analog-hands,
    #circle.variant-sleek-analog .analog-hands { display:block; }
    .analog-hand { position:absolute; bottom:50%; transform-origin:center bottom; border-radius:999px 999px 2px 2px; }
    .hour-hand {
      width:var(--hour-hand-w); height:24%;
      left:calc(50% - var(--hour-hand-w) / 2);
      background:var(--green); box-shadow:0 0 8px color-mix(in srgb, var(--green) 40%, transparent);
    }
    .minute-hand {
      width:var(--min-hand-w); height:32%;
      left:calc(50% - var(--min-hand-w) / 2);
      background:var(--green); box-shadow:0 0 8px color-mix(in srgb, var(--green) 40%, transparent);
    }
    .second-hand {
      width:var(--sec-hand-w); height:40%;
      left:calc(50% - var(--sec-hand-w) / 2);
      background:var(--red); box-shadow:0 0 10px color-mix(in srgb, var(--red) 60%, transparent);
    }
    .analog-center {
      position:absolute; top:50%; left:50%;
      width:12px; height:12px; margin:-6px 0 0 -6px;
      border-radius:50%; background:var(--green);
      box-shadow:0 0 10px var(--green); z-index:2;
    }

    /* ── 5. Variants Styles ──────────────────────────── */
    /* Analog Variant */
    #circle.variant-analog .digital-clock,
    #circle.variant-analog .countdown,
    #circle.variant-analog .progress-bar-container,
    #circle.variant-analog .studio-mark { display:none; }
    #circle.variant-analog .led {
      width:clamp(3px,1cqmin,6px); height:clamp(3px,1cqmin,6px);
      background:#333; opacity:.6;
    }
    #circle.variant-analog .led.on { background:var(--red); opacity:1; }
    #circle.variant-analog .hour-led {
      width:clamp(5px,1.6cqmin,10px); height:clamp(5px,1.6cqmin,10px);
      background:#4a4a4a; opacity:.7;
    }
    #circle.variant-analog .hour-led.on { background:var(--green); opacity:1; }
    #circle.variant-analog .digital-date { top:24%; font-size:clamp(.7rem, 3.2cqmin, 1.5rem); }

    /* Minimal Variant */
    #circle.variant-minimal .led,
    #circle.variant-minimal .hour-led,
    #circle.variant-minimal .progress-bar-container,
    #circle.variant-minimal .studio-mark { display:none; }
    #circle.variant-minimal .digital-clock {
      top:50%; font-size:clamp(1.8rem, 18cqmin, 8.5rem);
      -webkit-text-stroke:0; text-shadow:0 0 24px color-mix(in srgb, var(--green) 35%, transparent);
    }
    #circle.variant-minimal .digital-clock.h12 { font-size:clamp(1.4rem, 14cqmin, 6.8rem); }
    #circle.variant-minimal .digital-date {
      top:38%; font-size:clamp(.65rem, 3.2cqmin, 1.3rem);
      -webkit-text-stroke:0; opacity:.85;
    }
    #circle.variant-minimal .precision-clock { bottom:24%; font-size:clamp(.55rem, 1.8cqmin, 1rem); -webkit-text-stroke:0; }
    #circle.variant-minimal .tz-label { bottom:68%; -webkit-text-stroke:0; }
    #circle.variant-minimal .signature { bottom:22%; -webkit-text-stroke:0; }

    /* Modern Variant */
    #circle.variant-modern .led,
    #circle.variant-modern .hour-led,
    #circle.variant-modern .countdown,
    #circle.variant-modern .studio-mark { display:none; }
    #circle.variant-modern::after {
      content:''; position:absolute; inset:2%; border-radius:50%;
      background: conic-gradient(
        from 0deg,
        var(--modern-color, var(--green)) 0deg,
        var(--modern-color, var(--green)) var(--progress-deg, 0deg),
        rgba(255,255,255,.05) var(--progress-deg, 0deg)
      );
      -webkit-mask: radial-gradient(circle, transparent calc(100% - 10px), #000 calc(100% - 10px));
      mask: radial-gradient(circle, transparent calc(100% - 10px), #000 calc(100% - 10px));
      pointer-events:none; z-index:0;
    }
    #circle.variant-modern .digital-clock { top:46%; z-index:1; }
    #circle.variant-modern .digital-date { z-index:2; }
    #circle.variant-modern .precision-clock { bottom:29%; }
    #circle.variant-modern .tz-label { bottom:32%; }
    #circle.variant-modern .signature { z-index:1; bottom:26%; }
    #circle.variant-modern .progress-bar-container {
      top:auto; bottom:35%; width:120%; height:80px;
      border:none; background:color-mix(in srgb, var(--green) 15%, transparent);
    }
    #circle.variant-modern .progress-bar-fill { border-radius:3px; box-shadow:0 0 8px currentColor; }

    /* Neon Variant */
    .clock-circle.variant-neon {
      aspect-ratio: 16 / 9;
      width: min(94vw, calc((100dvh - 96px) * 16 / 9), 900px);
      border-radius: 16px; background: var(--face-bg);
      border: 1px solid color-mix(in srgb, var(--green) 60%, transparent);
      box-shadow: 0 0 50px color-mix(in srgb, var(--green) 20%, transparent),
                  inset 0 0 80px color-mix(in srgb, var(--green) 6%, transparent);
      overflow: hidden;
    }
    .clock-circle.variant-neon::before {
      content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 19px,
          color-mix(in srgb, var(--green) 8%, transparent) 19px,
          color-mix(in srgb, var(--green) 8%, transparent) 20px),
        repeating-linear-gradient(90deg, transparent, transparent 19px,
          color-mix(in srgb, var(--green) 8%, transparent) 19px,
          color-mix(in srgb, var(--green) 8%, transparent) 20px);
      opacity:.6;
    }
    .clock-circle.variant-neon::after {
      content:''; position:absolute; inset:0; pointer-events:none; z-index:3;
      background:repeating-linear-gradient(0deg, transparent, transparent 2px,
        rgba(0,0,0,.18) 2px, rgba(0,0,0,.18) 4px);
      animation: scan 8s linear infinite;
    }
    @keyframes scan { from { transform:translateY(0); } to { transform:translateY(20px); } }
    #circle.variant-neon .led,
    #circle.variant-neon .hour-led,
    #circle.variant-neon .countdown,
    #circle.variant-neon .studio-mark,
    #circle.variant-neon .analog-hands { display:none; }
    #circle.variant-neon .digital-clock {
      top:48%; z-index:1; font-size:clamp(2rem, 18cqmin, 7rem);
      -webkit-text-stroke:0;
      text-shadow: 0 0 24px var(--green), 0 0 48px color-mix(in srgb, var(--green) 40%, transparent);
    }
    #circle.variant-neon .digital-clock.h12 { font-size:clamp(1.5rem, 14cqmin, 5.5rem); }
    #circle.variant-neon .digital-date {
      top:10%; left:5%; right:auto; transform:none; text-align:left;
      -webkit-text-stroke:0; font-size:clamp(.6rem, 2.8cqmin, 1.1rem); letter-spacing:.08em; z-index:2;
    }
    #circle.variant-neon .precision-clock {
      top:auto; bottom:22%; left:5%; right:auto; transform:none; text-align:left;
      font-size:clamp(.55rem, 1.8cqmin, 1rem); -webkit-text-stroke:0; z-index:2;
    }
    #circle.variant-neon .tz-label {
      top:auto; bottom:22%; left:auto; right:5%; transform:none; text-align:right;
      max-width:45%; -webkit-text-stroke:0; z-index:2;
    }
    #circle.variant-neon .signature {
      top:5%; bottom:auto; right:5%; left:auto; transform:none;
      opacity:.4; z-index:2; font-size:clamp(.5rem, 1.4cqmin, .8rem);
    }
    #circle.variant-neon .progress-bar-container {
      top:auto; bottom:8%; left:5%; right:5%; width:auto; transform:none; height:3px;
      border:none; border-radius:0; background:color-mix(in srgb, var(--green) 15%, transparent); z-index:2;
    }
    #circle.variant-neon .progress-bar-fill { border-radius:0; background:var(--green); box-shadow:0 0 8px var(--green); }

    /* Bars Variant */
    .clock-circle.variant-bars {
      aspect-ratio: 16 / 9;
      width: min(94vw, calc((100dvh - 96px) * 16 / 9), 900px);
      border-radius: 16px; background: var(--face-bg);
      border: 1px solid color-mix(in srgb, var(--green) 25%, transparent);
    }
    .bars-row {
      display:none; position:absolute; left:6%; right:6%; bottom:8%; height:24%;
      gap:2px; align-items:flex-end; pointer-events:none; z-index:1;
    }
    .clock-circle.variant-bars .bars-row { display:flex; }
    .bar {
      flex:1 1 0; min-width:0; background:color-mix(in srgb, var(--green) 15%, transparent);
      border-radius:2px 2px 0 0; height:60%; transition: background .2s, box-shadow .2s, height .2s;
    }
    .bar.hour-mark { height:80%; background:color-mix(in srgb, var(--green) 30%, transparent); }
    .bar.on { background:var(--green); box-shadow:0 0 8px var(--green), 0 -4px 12px color-mix(in srgb, var(--green) 40%, transparent); }
    .bar.hour-mark.on { background:var(--amber); box-shadow:0 0 10px var(--amber), 0 -4px 14px color-mix(in srgb, var(--amber) 50%, transparent); }
    #circle.variant-bars .led, #circle.variant-bars .hour-led, #circle.variant-bars .countdown,
    #circle.variant-bars .studio-mark, #circle.variant-bars .analog-hands,
    #circle.variant-bars .progress-bar-container { display:none; }
    #circle.variant-bars .digital-clock { top:40%; font-size:clamp(1.8rem, 13cqmin, 5rem); -webkit-text-stroke:0; text-shadow:0 0 12px color-mix(in srgb, var(--green) 30%, transparent); }
    #circle.variant-bars .digital-clock.h12 { font-size:clamp(1.4rem, 10cqmin, 4rem); }
    #circle.variant-bars .digital-date { top:12%; -webkit-text-stroke:0; font-size:clamp(.6rem, 3cqmin, 1.2rem); }
    #circle.variant-bars .precision-clock { top:58%; bottom:auto; -webkit-text-stroke:0; font-size:clamp(.55rem, 1.9cqmin, 1rem); }
    #circle.variant-bars .tz-label { top:22%; bottom:auto; -webkit-text-stroke:0; font-size:clamp(.5rem, 1.8cqmin, .85rem); }
    #circle.variant-bars .signature { bottom:2%; opacity:.35; font-size:clamp(.5rem, 1.2cqmin, .75rem); }

    /* Matrix Variant */
    .matrix-canvas { position:absolute; inset:0; border-radius:50%; display:none; pointer-events:none; z-index:0; }
    #circle.variant-matrix .matrix-canvas { display:block; }
    #circle.variant-matrix .led, #circle.variant-matrix .hour-led, #circle.variant-matrix .countdown,
    #circle.variant-matrix .studio-mark, #circle.variant-matrix .progress-bar-container,
    #circle.variant-matrix .analog-hands { display:none; }
    #circle.variant-matrix .digital-clock {
      z-index:3; text-shadow: 0 0 20px var(--green), 0 0 40px var(--green), 0 0 60px color-mix(in srgb, var(--green) 60%, transparent);
      -webkit-text-stroke: min(2px,.04em) #000;
    }
    #circle.variant-matrix .digital-date { z-index:3; -webkit-text-stroke: 0; text-shadow: 0 0 10px var(--amber); }
    #circle.variant-matrix .precision-clock, #circle.variant-matrix .tz-label, #circle.variant-matrix .signature { z-index:3; -webkit-text-stroke:0; }

    /* Terminal Variant */
    .clock-circle.variant-terminal {
      aspect-ratio: 16 / 10;
      width: min(92vw, calc((100dvh - 96px) * 16 / 10), 860px);
      border-radius: 10px; background: color-mix(in srgb, var(--face-bg) 85%, var(--green) 15%);
      border: 1px solid color-mix(in srgb, var(--green) 40%, transparent);
      box-shadow: 0 0 40px color-mix(in srgb, var(--green) 15%, transparent), inset 0 0 100px color-mix(in srgb, var(--green) 3%, transparent);
      overflow: hidden; font-family: ui-monospace, 'SF Mono', 'Consolas', 'Courier New', monospace;
    }
    .clock-circle.variant-terminal::after {
      content:''; position:absolute; inset:0; pointer-events:none; z-index:10;
      background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.08) 2px, rgba(0,0,0,.08) 4px);
    }
    .term-bar, .term-prompt, .term-cursor { display:none; }
    .clock-circle.variant-terminal .term-bar, .clock-circle.variant-terminal .term-prompt { display: flex; }
    .clock-circle.variant-terminal .term-cursor { display: block; }
    .term-bar {
      position:absolute; top:0; left:0; right:0; height: 30px; align-items:center; gap:14px;
      padding: 0 16px; background: color-mix(in srgb, var(--green) 10%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--green) 22%, transparent);
      font-size: 11px; color: color-mix(in srgb, var(--green) 70%, #fff); letter-spacing: .04em; z-index: 3;
    }
    .term-dots { display: flex; gap: 6px; }
    .term-dots span { width: 10px; height: 10px; border-radius: 50%; }
    .term-dots span:nth-child(1) { background: #ff5f57; }
    .term-dots span:nth-child(2) { background: #febc2e; }
    .term-dots span:nth-child(3) { background: #28c840; }
    .term-prompt {
      position: absolute; top: 14%; left: 6%; align-items: center; gap: 6px;
      font-size: clamp(.75rem, 2.8cqmin, 1.2rem); color: color-mix(in srgb, var(--green) 85%, #fff); letter-spacing: .02em; z-index: 2;
    }
    .term-dollar { color: var(--amber); font-weight: 600; }
    .term-cursor {
      position: absolute; bottom: 14%; left: 6%; width: .6em; height: 1.1em;
      background: var(--green); box-shadow: 0 0 10px var(--green); animation: term-blink 1s steps(1) infinite; z-index: 2;
    }
    @keyframes term-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    #circle.variant-terminal .led, #circle.variant-terminal .hour-led, #circle.variant-terminal .studio-mark,
    #circle.variant-terminal .analog-hands, #circle.variant-terminal .matrix-canvas,
    #circle.variant-terminal .bars-row, #circle.variant-terminal .progress-bar-container { display: none; }
    @keyframes terminal-glow { 0%, 100% { text-shadow: 0 0 12px color-mix(in srgb, var(--green) 40%, transparent); } 50% { text-shadow: 0 0 22px color-mix(in srgb, var(--green) 75%, transparent); } }
    #circle.variant-terminal .digital-clock {
      top: 34%; left: 6%; transform: none; text-align: left; font-size: clamp(1.6rem, 8cqmin, 3.4rem);
      -webkit-text-stroke: 0; color: var(--green); animation: terminal-glow 3s ease-in-out infinite; z-index: 2;
    }
    #circle.variant-terminal .digital-clock.h12 { font-size: clamp(1.3rem, 6.5cqmin, 2.8rem); }
    #circle.variant-terminal .tz-label {
      top: 47%; left: 6%; right: auto; transform: none; text-align: left; max-width: 50%;
      -webkit-text-stroke: 0; color: color-mix(in srgb, var(--green) 60%, #fff); opacity: .85; font-size: clamp(.6rem, 2cqmin, .9rem); letter-spacing: .1em; z-index: 2;
    }
    #circle.variant-terminal .digital-date {
      top: 60%; left: 6%; transform: none; text-align: left; width: auto; white-space: nowrap;
      -webkit-text-stroke: 0; color: var(--amber); font-size: clamp(.7rem, 2.5cqmin, 1.1rem); z-index: 2;
    }
    #circle.variant-terminal .countdown {
      top: 68%; left: 6%; transform: none; text-align: left; -webkit-text-stroke: 0; font-size: clamp(.65rem, 2.2cqmin, 1rem); opacity: .85; z-index: 2;
    }
    #circle.variant-terminal .countdown::before { content: '→ '; color: var(--amber); }
    #circle.variant-terminal .precision-clock {
      top: auto; bottom: 8%; left: 6%; transform: none; text-align: left; -webkit-text-stroke: 0;
      color: color-mix(in srgb, var(--green) 55%, #fff); opacity: .7; font-size: clamp(.55rem, 1.8cqmin, .85rem); z-index: 2;
    }
    #circle.variant-terminal .precision-clock::before { content: '› '; color: var(--amber); }
    #circle.variant-terminal .signature {
      top: auto; bottom: 8%; right: 6%; left: auto; transform: none; text-align: right;
      opacity: .4; font-size: clamp(.5rem, 1.4cqmin, .75rem); z-index: 2;
    }

    /* HUD Variant */
    .clock-circle.variant-hud {
      aspect-ratio: 16 / 10;
      width: min(92vw, calc((100dvh - 96px) * 16 / 10), 860px);
      border-radius: 12px; background: color-mix(in srgb, var(--face-bg) 88%, var(--green) 12%);
      border: 1px solid color-mix(in srgb, var(--green) 30%, transparent);
      box-shadow: 0 0 50px color-mix(in srgb, var(--green) 12%, transparent), inset 0 0 100px color-mix(in srgb, var(--green) 2%, transparent);
      overflow: hidden;
    }
    .hud-frame { display:none; position:absolute; inset:0; pointer-events:none; z-index:1; }
    .clock-circle.variant-hud .hud-frame { display: block; }
    .hud-frame::before {
      content:''; position:absolute; inset:0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.08) 2px, rgba(0,0,0,.08) 4px);
      animation: hud-scan 6s linear infinite; pointer-events:none;
    }
    @keyframes hud-scan { from { transform: translateY(0); } to { transform: translateY(4px); } }

    #circle.variant-hud .led, #circle.variant-hud .hour-led, #circle.variant-hud .studio-mark,

    #circle.variant-sleek .digital-date {

      letter-spacing: 0.15em; text-transform: uppercase; font-weight: 500;
    }
    #circle.variant-sleek .digital-clock {
      top: 45%; left: 50%; transform: translate(-50%, -50%);

    }
    #circle.variant-sleek .digital-clock.h12 { font-size: clamp(3rem, 18cqmin, 8.5rem); }
    #circle.variant-sleek .digital-clock .ms {
      color: #64748b; font-size: 0.6em; font-weight: 400; letter-spacing: 0;
    }
    #circle.variant-sleek .digital-clock .period {
      color: #94a3b8; font-size: 0.45em; font-weight: 500; margin-left: 8px; letter-spacing: 0.05em; vertical-align: baseline;
    }
    
    .sleek-details {
      font-family: ui-monospace, 'SF Mono', 'Consolas', monospace;
      font-size: clamp(0.75rem, 2.2cqmin, 1.1rem);
      color: #64748b; text-align: center; line-height: 1.8;
    }
    .sleek-details span { color: #94a3b8; }

    /* Sleek Analog Variant */
    .clock-circle.variant-sleek-analog {
      background: var(--face-bg);
      box-shadow: 0 0 40px #030303;
    }
    #circle.variant-sleek-analog .digital-clock,

    #circle.variant-sleek-analog .studio-mark,
    #circle.variant-sleek-analog .digital-date { display:none; }
    
    #circle.variant-sleek-analog .hour-led {
      width: clamp(3px, 0.8cqmin, 5px); height: clamp(12px, 3.5cqmin, 18px);

      transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
    }
    #circle.variant-sleek-analog .hour-led.on { background: #a4bcd6; box-shadow: 0 0 8px #a4bcd6; }
    
    #circle.variant-sleek-analog .led {
      width: clamp(2px, 0.5cqmin, 3px); height: clamp(6px, 1.8cqmin, 10px);
      border-radius: 1px; background: #36445c; opacity: 1;
      transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
    }
    #circle.variant-sleek-analog .led.on { background: #a4bcd6; }
    
    #circle.variant-sleek-analog .hour-hand {
      width: var(--hour-hand-w); height: 22%; left: calc(50% - var(--hour-hand-w) / 2);
      background: #a4bcd6; box-shadow: none;
    }
    #circle.variant-sleek-analog .minute-hand {
      width: var(--min-hand-w); height: 34%; left: calc(50% - var(--min-hand-w) / 2);
      background: #a4bcd6; box-shadow: none;
    }
    #circle.variant-sleek-analog .second-hand {

      background: #ff7b00; box-shadow: none;
    }
    #circle.variant-sleek-analog .analog-center {
      width: 14px; height: 14px; margin: -7px 0 0 -7px;
      background: #ff7b00; box-shadow: none;
    }
    
    #circle.variant-sleek-analog .tz-label {

    }
    #circle.variant-sleek-analog .precision-clock {
      top: 76.5%; bottom: auto; color: #9e5c1e; font-size: clamp(.7rem, 2.5cqmin, 1.2rem); opacity: 1;
    }
    #circle.variant-sleek-analog .signature {
      top: 80%; bottom: auto; color: #5c6f8a; opacity: .7; font-size: clamp(.5rem, 1.5cqmin, .8rem);

    /* ── 6. UI Controls & Status Bar ─────────────────── */
    .settings-button {
      position:fixed; z-index:5; top:14px; right:16px; width:42px; height:42px;
      border:1px solid #484848; border-radius:50%; background:#111e; color:#ddd; font-size:20px; cursor:pointer;
    }
    .settings-panel {
      position:fixed; z-index:6; top:64px; right:16px; width:min(340px,calc(100vw - 32px));
      padding:16px 18px; border:1px solid #494949; border-radius:10px; background:#101210f2; color:#eee;
      box-shadow:0 14px 44px #000c; font:14px/1.4 system-ui,sans-serif;
      backdrop-filter:blur(4px); max-height:calc(100vh - 80px); overflow-y:auto;
    }
    .settings-panel[hidden] { display:none; }
    .settings-panel h2 { margin:0 0 10px; font-size:14px; color:#aab3ad; font-weight:600; letter-spacing:.03em; text-transform:uppercase; }
    .setting-row { display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:12px; margin-top:10px; }
    .setting-row label { color:#aab3ad; font-size:12px; }
    .setting-row select { width:100%; min-width:0; min-height:34px; padding:0 8px; border:1px solid #444; border-radius:6px; background:#080a09; color:#eee; }
    .setting-row.pulse-row { grid-template-columns:1fr auto; }
    .pulse-toggle { appearance:none; width:38px; height:22px; border-radius:12px; background:#3b423d; position:relative; cursor:pointer; transition:background .15s; }
    .pulse-toggle::after { content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; border-radius:50%; background:#ddd; transition:transform .15s; }
    .pulse-toggle:checked { background:#078d32; }
    .pulse-toggle:checked::after { transform:translateX(16px); background:#fff; }
    .resync-button {
      margin-top:14px; width:100%; padding:8px 10px; border:1px solid #444; border-radius:6px;
      background:#0f1311; color:#cfd8d2; font:13px system-ui,sans-serif; cursor:pointer;
    }
    .resync-button:hover { background:#171d19; }
    .resync-button:disabled { opacity:.5; cursor:wait; }

    .live-status {
      position:fixed; z-index:4; left:0; right:0; bottom:10px; margin:0 auto;
      width:fit-content; max-width:calc(100vw - 16px);
      display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:4px 10px;
      padding:6px 12px; border:1px solid #253028; border-radius:6px; background:#080b0aee;
      color:#aab5ad; font:12px/1.3 monospace; font-variant-numeric:tabular-nums;
      box-shadow:0 4px 16px #000a;
    }
    .status-main { display:flex; align-items:center; gap:8px; min-width:0; max-width:100%; }
    .status-metrics { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:2px 10px; min-width:0; }
    .status-metrics[hidden] { display:none; }
    .live-status i { flex:0 0 auto; width:8px; height:8px; border-radius:50%; background:#777; }
    .live-status i.ok { background:var(--green); box-shadow:0 0 6px var(--green); }
    .live-status i.warn { background:var(--amber); }
    .live-status i.bad { background:var(--red); }
    .live-status #syncText { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
    .live-status .metric { flex:0 0 auto; white-space:nowrap; color:#7a8a80; }
    .live-status .metric[hidden] { display:none; }
    .live-status .metric b { font-weight:500; }
    .live-status .metric b.q-excellent { color:var(--green); }
    .live-status .metric b.q-good { color:var(--amber); }
    .live-status .metric b.q-weak { color:var(--red); }
    .live-status .divider { color:#3a4540; }
    .live-status .divider[hidden] { display:none; }

    /* ── 7. Responsive Adjustments ───────────────────── */
    @media(max-width:720px) { .live-status .divider { display:none; } }
    @media(max-width:600px) {

      }
      .progress-bar-container { height:8px; }
      .live-status { font-size:11px; gap:3px 8px; padding:5px 10px; }

            source:'sursa', clockAhead:'ceasul PC-ului este', ahead:'înainte', behind:'înapoi', lastSync:'ultima sincronizare' },
    };

    const VARIANTS = ['room-control', 'analog', 'minimal', 'modern', 'neon', 'bars', 'matrix', 'terminal', 'hud', 'sleek', 'sleek-analog'];
    const THEMES   = ['classic', 'cyan', 'amber', 'mono', 'vaporwave', 'matrix'];

    const LANG_ALIASES = { nb: 'no', nn: 'no' };
    function detectLanguage() {
      const stored = localStorage.getItem('masterclock-lang');
      if (stored && I18N[stored]) return stored;
      const raw = (navigator.language || 'en').toLowerCase();
      const short = raw.split('-')[0];
      if (I18N[short]) return short;
      if (LANG_ALIASES[short] && I18N[LANG_ALIASES[short]]) return LANG_ALIASES[short];
      return 'en';
    }

    const circle           = document.getElementById('circle');
    const digitalClock     = document.getElementById('digitalClock');
    const digitalDate      = document.getElementById('digitalDate');
    const countdown        = document.getElementById('countdown');
    const progressFill     = document.getElementById('progressFill');
    const precisionClock   = document.getElementById('precisionClock');
    const settingsPanel    = document.getElementById('settingsPanel');
    const settingsButton   = document.getElementById('settingsButton');
    const variantSelect    = document.getElementById('variantSelect');
    const themeSelect      = document.getElementById('themeSelect');
    const languageSelect   = document.getElementById('languageSelect');
    const timezoneSelect   = document.getElementById('timezoneSelect');
    const hourFormatSelect = document.getElementById('hourFormatSelect');
    const pulseToggle      = document.getElementById('pulseToggle');
    const resyncButton     = document.getElementById('resyncButton');
    const syncDot          = document.getElementById('syncDot');
    const syncText         = document.getElementById('syncText');
    const offsetMetric     = document.getElementById('offsetMetric');
    const precMetric       = document.getElementById('precMetric');
    const rttMetric        = document.getElementById('rttMetric');
    const divider          = document.getElementById('divider');
    const statusMetrics    = document.getElementById('statusMetrics');
    const tzLabel          = document.getElementById('tzLabel');
    const hourHandEl       = document.getElementById('hourHand');
    const minuteHandEl     = document.getElementById('minuteHand');
    const secondHandEl     = document.getElementById('secondHand');
    const barsRow          = document.getElementById('barsRow');
    const matrixCanvas     = document.getElementById('matrixCanvas');
    const sleekDetails     = document.getElementById('sleekDetails');

    const secondLeds = [];
    const hourLeds = [];
    const bars = [];

    let matrixCtx = null;
    let matrixCols = 0;
    let matrixDrops = [];
    let matrixFontSize = 14;

    let language = detectLanguage();
    let selectedZone   = localStorage.getItem('masterclock-timezone') || 'UTC';
    let hourFormat     = localStorage.getItem('masterclock-hourformat') || '24';
    let pulseEnabled   = localStorage.getItem('masterclock-pulse') !== 'false';
    let variant        = localStorage.getItem('masterclock-variant') || 'room-control';
    if (!VARIANTS.includes(variant)) variant = 'room-control';
    let theme          = localStorage.getItem('masterclock-theme') || 'classic';
    if (!THEMES.includes(theme)) theme = 'classic';

    let targetOffset    = null;
    let deviceOffsetMs  = null;
    let lastRtt         = null;
    let lastUnc         = null;
    let lastSyncMono    = null;
    let nextSyncAt      = null;
    let syncing         = false;
    let lastRenderedSec = -1;

    let syncState = { kind:'', key:'searching', extra:'' };
    let fmtCacheKey = '';
    let fmtTime = null;
    let fmtDate = null;
    let themeColors = { green:'#0FFF50', amber:'#ff9100', red:'#ff3131' };

    function t(key) { return (I18N[language] || I18N.en)[key] || key; }

    function refreshThemeColors() {
      const s = getComputedStyle(document.documentElement);
      themeColors = {
        green: s.getPropertyValue('--green').trim() || '#0FFF50',
        amber: s.getPropertyValue('--amber').trim() || '#ff9100',
        red:   s.getPropertyValue('--red').trim()   || '#ff3131'
      };
    }

    function applyTheme() {
      document.documentElement.dataset.theme = theme;
      refreshThemeColors();
    }

    function applyI18n() {
      document.documentElement.lang = language;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (k) el.textContent = t(k);
      });
      settingsButton.setAttribute('aria-label', t('settings'));
      updateStatusDisplay();
      updateMetrics();
    }

    function applyVariant() {
      circle.classList.remove(...VARIANTS.map(v => 'variant-' + v));
      circle.classList.add('variant-' + variant);
      lastRenderedSec = -1;
    }

    function updateStatusDisplay() {
      syncDot.className = syncState.kind;
      syncText.textContent = t(syncState.key) + (syncState.extra ? ' · ' + syncState.extra : '');
      updateSleekDetails();
    }

    function updateSleekDetails() {
      if (deviceOffsetMs === null || lastUnc === null) {
        sleekDetails.innerHTML = `<span>${t(syncState.key)}</span>`;
        return;
      }
      const srcLabel = syncState.extra || '—';
      const prec = `±${Math.round(lastUnc)} ms`;
      const dir = deviceOffsetMs >= 0 ? t('ahead') : t('behind');
      const off = `${Math.round(Math.abs(deviceOffsetMs))} ms ${dir}`;
      const lastSyncStr = new Date(performance.timeOrigin + lastSyncMono).toLocaleTimeString(language, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const tzStr = zone().replace(/_/g, ' ');
      
      sleekDetails.innerHTML = `
        ${t('source')}: <span>${srcLabel}</span> · ${t('precision')} <span>${prec}</span><br>
        ${t('clockAhead')} <span>${off}</span><br>
        ${t('lastSync')}: <span>${lastSyncStr}</span><br>
        ${t('timezone')}: <span>${tzStr}</span>
      `;
    }

    function updateMetrics() {
      const show = deviceOffsetMs !== null && lastUnc !== null;
      divider.hidden       = !show;
      statusMetrics.hidden = !show;
      rttMetric.hidden    = !show || lastRtt === null;
      if (!show) return;

      const sign = deviceOffsetMs >= 0 ? '+' : '−';
      offsetMetric.innerHTML = `${t('offset')} <b>${sign}${Math.round(Math.abs(deviceOffsetMs))} ms</b>`;

      const pq = lastUnc < 50 ? 'excellent' : lastUnc < 200 ? 'good' : 'weak';
      precMetric.innerHTML = `${t('precision')} <b class="q-${pq}">±${Math.round(lastUnc)} ms</b>`;

      if (lastRtt !== null) {
        const q = lastRtt < 80 ? 'excellent' : lastRtt < 200 ? 'good' : 'weak';
        rttMetric.innerHTML = `${t('rtt')} <b class="q-${q}">${Math.round(lastRtt)} ms</b>`;
      }
      
      updateSleekDetails();
    }

    function setSync(kind, key, extra = '') {
      syncState = { kind, key, extra };
      updateStatusDisplay();
    }

    const zones = Intl.supportedValuesOf ? Intl.supportedValuesOf('timeZone') : [];
    for (const z of zones) {
      if (z === 'UTC') continue;
      const opt = document.createElement('option');
      opt.value = z;
      opt.textContent = z;
      timezoneSelect.appendChild(opt);
    }
    if (selectedZone !== 'UTC' && selectedZone !== 'DEVICE' && !zones.includes(selectedZone)) selectedZone = 'UTC';
    timezoneSelect.value   = selectedZone;
    languageSelect.value   = language;
    hourFormatSelect.value = hourFormat;
    pulseToggle.checked    = pulseEnabled;
    variantSelect.value    = variant;
    themeSelect.value      = theme;
    digitalClock.classList.toggle('h12', hourFormat === '12');
    applyTheme();
    applyI18n();
    applyVariant();
    updateTzLabel();

    function addLeds(count, radius, cssClass, target) {
      for (let i = 0; i < count; i++) {
        const deg = i * (360 / count);
        const a = (deg - 90) * Math.PI / 180;
        const led = document.createElement('span');
        led.className = cssClass;
        led.style.left = `${50 + radius * Math.cos(a)}%`;
        led.style.top  = `${50 + radius * Math.sin(a)}%`;
        led.style.setProperty('--rot', `${deg}deg`);
        circle.appendChild(led);
        target.push(led);
      }
    }
    addLeds(60, 40, 'led', secondLeds);
    addLeds(12, 47, 'hour-led', hourLeds);

    for (let i = 0; i < 60; i++) {
      const bar = document.createElement('span');
      bar.className = 'bar' + (i % 5 === 0 ? ' hour-mark' : '');
      barsRow.appendChild(bar);
      bars.push(bar);
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const trunc3 = s => String(s).replace(/(\.\d{3})\d+/, '$1');

    const API_SOURCES = [
      { name: 'timeapi.io',
        url: 'https://timeapi.io/api/time/current/zone?timeZone=UTC',
        parse: j => Date.parse(trunc3(j.dateTime) + 'Z') },
      { name: 'worldtimeapi.org',
        url: 'https://worldtimeapi.org/api/timezone/Etc/UTC',
        parse: j => Date.parse(trunc3(j.utc_datetime)) }
    ];

    async function syncApi(src) {
      let best = null;
      for (let i = 0; i < API_SAMPLES; i++) {
        const ctl = new AbortController();
        const to = setTimeout(() => ctl.abort(), REQUEST_TIMEOUT_MS);
        try {
          const t0 = performance.now();
          const r = await fetch(src.url, { cache: 'no-store', signal: ctl.signal });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const j = await r.json();
          const t1 = performance.now();
          const srv = src.parse(j);
          if (!Number.isFinite(srv)) throw new Error('parse');
          const rtt = t1 - t0;
          const s = { offset: srv - (t0 + rtt / 2), rttMin: rtt, unc: rtt / 2 + 1 };
          if (!best || s.unc < best.unc) best = s;
        } catch (_) { }
        finally { clearTimeout(to); }
        if (i < API_SAMPLES - 1) await sleep(API_SAMPLE_GAP_MS);
      }
      if (!best) throw new Error('no samples from ' + src.name);
      return best;
    }

    function canUseHeaderFallback() {
      return location.protocol === 'http:' || location.protocol === 'https:';
    }

    function marzullo(intervals) {
      const ev = [];
      for (const [lo, hi] of intervals) { ev.push([lo, 1]); ev.push([hi, -1]); }
      ev.sort((a, b) => a[0] - b[0] || b[1] - a[1]);
      let cnt = 0, best = 0, bLo = 0, bHi = 0;
      for (let i = 0; i < ev.length; i++) {
        cnt += ev[i][1];
        if (cnt > best) { best = cnt; bLo = ev[i][0]; bHi = ev[i + 1][0]; }
      }
      return { count: best, lo: bLo, hi: bHi };
    }

    async function syncDateHeader() {
      const iv = [];
      let method = 'HEAD';
      const base = location.href.split('#')[0].split('?')[0];
      for (let i = 0; i < HEADER_SAMPLES; i++) {
        try {
          const url = `${base}?_=${Math.random().toString(36).slice(2)}`;
          const sendMono = performance.now();
          const r = await fetch(url, { method, cache: 'no-store' });
          const recvMono = performance.now();
          if (!r.ok) {
            if (method === 'HEAD') { method = 'GET'; continue; }
            throw new Error('HTTP ' + r.status);
          }
          const d = r.headers.get('Date');
          const age = parseInt(r.headers.get('Age') || '0', 10);
          if (d && !age) {
            const D = Date.parse(d);
            if (Number.isFinite(D)) iv.push([D - recvMono, D + 1000 - sendMono]);
          }
        } catch (_) { }
        await sleep(130 + Math.random() * 40);
      }
      if (iv.length < 3) throw new Error('no Date header');
      const m = marzullo(iv);
      if (m.count < Math.max(3, Math.ceil(iv.length * HEADER_MIN_AGREE))) throw new Error('inconsistent samples');
      return { offset: (m.lo + m.hi) / 2, rttMin: null, unc: (m.hi - m.lo) / 2 + 1 };
    }

    function scheduleNextSync() {
      nextSyncAt = performance.now() + (syncState.kind === 'ok' ? RESYNC_OK_MS : RESYNC_WARN_MS);
    }

    async function synchronize() {
      if (syncing) return;
      syncing = true;
      resyncButton.disabled = true;
      setSync(targetOffset === null ? '' : 'warn',
              targetOffset === null ? 'searching' : 'syncing');

      const results = [];
      for (const src of API_SOURCES) {
        try { results.push(Object.assign(await syncApi(src), { name: src.name })); } catch (_) { }
      }

      let res = null, label = '', agree = null;
      if (results.length) {
        results.sort((a, b) => a.unc - b.unc);
        res = results[0];
        label = res.name;
        if (results.length > 1) {
          agree = results.slice(1).every(b => Math.abs(res.offset - b.offset) <= res.unc + b.unc);
          if (agree) label = `${results.length} ${t('sources')}`;
        }
      } else if (canUseHeaderFallback()) {
        try { res = await syncDateHeader(); label = 'HTTP Date'; } catch (_) { }
      }

      if (res) {
        const now = performance.now();
        targetOffset   = res.offset;
        lastRtt        = res.rttMin;
        lastUnc        = res.unc;
        lastSyncMono   = now;
        deviceOffsetMs = (now + res.offset) - Date.now();
        if (agree === false) setSync('warn', 'disagree', label);
        else setSync(res.unc < GOOD_UNC_MS ? 'ok' : 'warn', 'synced', label);
        updateMetrics();
      } else {
        setSync(targetOffset === null ? 'bad' : 'warn',
                targetOffset === null ? 'noSource' : 'syncFailed',
                targetOffset === null ? '' : t('holdover'));
      }

      scheduleNextSync();
      syncing = false;
      resyncButton.disabled = false;
    }

    function zone() {
      return selectedZone === 'DEVICE'
        ? Intl.DateTimeFormat().resolvedOptions().timeZone
        : selectedZone;
    }

    function updateTzLabel() { 
      tzLabel.textContent = zone().replace(/_/g, ' ');
      updateSleekDetails();
    }

    function ensureFormatters(tz) {
      const key = `${tz}|${language}|${hourFormat}`;
      if (key === fmtCacheKey) return;
      fmtCacheKey = key;
      updateTzLabel();
      const timeOpts = {
        timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit',
        fractionalSecondDigits: 3
      };
      if (hourFormat === '12') timeOpts.hour12 = true;
      else timeOpts.hourCycle = 'h23';
      fmtTime = new Intl.DateTimeFormat('en-GB', timeOpts);
      fmtDate = new Intl.DateTimeFormat(language, {
        timeZone: tz, weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric'
      });
    }

    function ensureMatrixSize() {
      if (!matrixCanvas) return;
      const w = matrixCanvas.clientWidth;
      const h = matrixCanvas.clientHeight;
      if (!w || !h) return;
      if (matrixCanvas.width === w && matrixCanvas.height === h) return;

      matrixCanvas.width = w;
      matrixCanvas.height = h;
      matrixCtx = matrixCanvas.getContext('2d');

      matrixFontSize = Math.max(10, Math.floor(w / 45));
      matrixCols = Math.ceil(w / matrixFontSize);
      matrixDrops = new Array(matrixCols).fill(0).map(() => Math.random() * (h / matrixFontSize));

      matrixCtx.fillStyle = '#000';
      matrixCtx.fillRect(0, 0, w, h);
    }

    function drawMatrixRain(color) {
      if (!matrixCtx || !matrixCols) return;
      const w = matrixCanvas.width;
      const h = matrixCanvas.height;
      const fs = matrixFontSize;

      matrixCtx.fillStyle = 'rgba(0, 0, 0, 0.09)';
      matrixCtx.fillRect(0, 0, w, h);

      matrixCtx.font = fs + 'px monospace';
      matrixCtx.fillStyle = color;

      for (let i = 0; i < matrixCols; i++) {
        const x = i * fs;
        const y = matrixDrops[i] * fs;
        const char = '0123456789'[Math.floor(Math.random() * 10)];
        matrixCtx.fillText(char, x, y);

        if (y > h && Math.random() > 0.975) {
          matrixDrops[i] = 0;
        } else {
          matrixDrops[i]++;
        }
      }
    }

    function render() {
      requestAnimationFrame(render);

      if (targetOffset === null) {
        if (variant === 'matrix') {
          ensureMatrixSize();
          drawMatrixRain(themeColors.green);
        }
        return;
      }

      const now = performance.now();
      const utcMs = now + targetOffset;
      const date  = new Date(utcMs);
      const tz    = zone();
      ensureFormatters(tz);

      const parts  = fmtTime.formatToParts(date).reduce((o, p) => (o[p.type] = p.value, o), {});
      const second = Number(parts.second);
      const ms     = parts.fractionalSecond || String(date.getUTCMilliseconds()).padStart(3, '0');
      const suffix = parts.dayPeriod ? ' ' + parts.dayPeriod : '';

      if (variant === 'sleek') {
        digitalClock.innerHTML = `${parts.hour}:${parts.minute}:${parts.second}<span class="ms">.${ms}</span><span class="period">${suffix}</span>`;
      } else {
        digitalClock.textContent = `${parts.hour}:${parts.minute}:${parts.second}${suffix}`;
      }
      precisionClock.textContent = `${parts.hour}:${parts.minute}:${parts.second}.${ms}${suffix}`;
      digitalDate.textContent = fmtDate.format(date);

      const remaining = (60 - second) % 60;
      countdown.textContent = String(remaining).padStart(2, '0');

      const color = second >= 50 ? themeColors.red : second >= 30 ? themeColors.amber : themeColors.green;
      countdown.style.color = color;
      progressFill.style.width = `${((second + Number(ms) / 1000) / 60) * 100}%`;
      progressFill.style.backgroundColor = color;

      if (variant === 'analog' || variant === 'sleek-analog') {
        const h = Number(parts.hour) % 12;
        const m = Number(parts.minute);
        const s = second + Number(ms) / 1000;
        hourHandEl.style.transform   = `rotate(${(h + m / 60) * 30}deg)`;
        minuteHandEl.style.transform = `rotate(${(m + s / 60) * 6}deg)`;
        secondHandEl.style.transform = `rotate(${s * 6}deg)`;
      }

      if (variant === 'modern') {
        const progress = (second + Number(ms) / 1000) / 60;
        circle.style.setProperty('--progress-deg', `${progress * 360}deg`);
        circle.style.setProperty('--modern-color', color);
      }

      if (variant === 'matrix') {
        ensureMatrixSize();
        const flash = pulseEnabled && second >= 50 && (Math.floor(now / 500) % 2 === 0);
        drawMatrixRain(flash ? themeColors.red : themeColors.green);
      }

      if (second !== lastRenderedSec) {
        lastRenderedSec = second;
        if (variant === 'analog' || variant === 'sleek-analog') {
          const currentHour = Number(parts.hour) % 12;
          secondLeds.forEach((led, i) => {
            led.classList.toggle('on', i === second);
            led.classList.remove('pulse-last10');
          });
          hourLeds.forEach((led, i) => led.classList.toggle('on', i === currentHour));
        } else if (variant === 'bars') {
          bars.forEach((bar, i) => bar.classList.toggle('on', i <= second));
        } else if (variant !== 'matrix') {
          secondLeds.forEach((led, i) => {
            const on = i <= second;
            led.classList.toggle('on', on);
            led.classList.toggle('pulse-last10', pulseEnabled && on && second >= 50);
          });
          const litHours = Math.floor(second / 5);
          hourLeds.forEach((led, i) => led.classList.toggle('on', i <= litHours));
        }
      }

      if (nextSyncAt !== null && now >= nextSyncAt && !syncing) synchronize();
    }

    settingsButton.addEventListener('click', (e) => {
      const open = settingsPanel.hidden;
      settingsPanel.hidden = !open;
      e.currentTarget.setAttribute('aria-expanded', String(open));
    });

    variantSelect.addEventListener('change', () => {
      variant = variantSelect.value;
      localStorage.setItem('masterclock-variant', variant);
      applyVariant();
    });
    themeSelect.addEventListener('change', () => {
      theme = themeSelect.value;
      localStorage.setItem('masterclock-theme', theme);
      applyTheme();
    });
    languageSelect.addEventListener('change', () => {
      language = languageSelect.value;
      localStorage.setItem('masterclock-lang', language);
      applyI18n();
    });
    timezoneSelect.addEventListener('change', () => {
      selectedZone = timezoneSelect.value;
      localStorage.setItem('masterclock-timezone', selectedZone);
      updateTzLabel();
    });
    hourFormatSelect.addEventListener('change', () => {
      hourFormat = hourFormatSelect.value;
      localStorage.setItem('masterclock-hourformat', hourFormat);
      digitalClock.classList.toggle('h12', hourFormat === '12');
    });
    pulseToggle.addEventListener('change', () => {
      pulseEnabled = pulseToggle.checked;
      localStorage.setItem('masterclock-pulse', String(pulseEnabled));
    });
    resyncButton.addEventListener('click', () => {
      if (!syncing) synchronize();
    });

    render();
    synchronize();
  </script>
</body>
</html>
