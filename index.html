<html lang="en" data-theme="classic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>MasterClock LED</title>
  <style>
    /* ═══════════════════════════════════════════════════════════
       INDEX
       1. Tokens & themes
       2. Base layout
       3. Shared text elements
       4. Components (LEDs, hands, bars, progress)
       5. Visibility map  ← which element is shown in which model
       6. Models        ← one block per model
       7. UI (settings, status bar)
       8. Responsive
       ═══════════════════════════════════════════════════════════ */

    /* ── 1. Tokens & themes ──────────────────────────────────── */
    :root {
      --chrome: 96px;                       /* vertical space kept free for the status bar */
      --hour-hand-w: 6px; --min-hand-w: 4px; --sec-hand-w: 2px;
      /* rectangular models (neon, bars, terminal, hud, sleek) */
      --ar-w: 16; --ar-h: 9; --rect-vw: 94vw; --rect-max: 900px; --radius: 16px;
    }
    :root, html[data-theme="classic"] {
      --green:#0FFF50; --amber:#ff9100; --red:#ff3131; --precis:#b3b3b3;
      --hour-on:#00d83a; --hour-off:#14521c; --sec-off:#5d1111;
      --yell:#fcffcd; --blu:#39fff5;
      --face-bg:#000000f3; --page-bg:#000;
    }
    html[data-theme="cyan"] {
      --green:#00e5ff; --amber:#2979ff; --red:#ff2d78;
      --hour-on:#0091ea; --hour-off:#0d3a44; --sec-off:#4a0e22;
      --yell:#ffd769; --blu:#fff239;
      --face-bg:#000d14; --page-bg:#00060a;
    }
    html[data-theme="amber"] {
      --green:#ffb300; --amber:#ff6d00; --red:#ff1744;
      --hour-on:#ff8f00; --hour-off:#3d2b00; --sec-off:#5d1015;
       --yell:#f1ff26; --blu:#ff8839;
      --face-bg:#0a0800; --page-bg:#060500;
    }
    html[data-theme="mono"] {
      --green:#f0f0f0; --amber:#999999; --red:#ffffff;
      --hour-on:#cccccc; --hour-off:#262626; --sec-off:#262626;
       --yell:#ffffff; --blu:#c7c7c7;
      --face-bg:#0a0a0a; --page-bg:#000;
    }
    html[data-theme="vaporwave"] {
      --green:#ff2d95; --amber:#c200ff; --red:#00e0ff;
      --hour-on:#b829a8; --hour-off:#3d0a26; --sec-off:#0d3540;
       --yell:#ffcde8; --blu:#ff3995;
      --face-bg:#0a0014; --page-bg:#050008;
    }
    html[data-theme="matrix"] {
      --green:#00ff41; --amber:#00a82b; --red:#ff0000;
      --hour-on:#00d633; --hour-off:#06210b; --sec-off:#4d0000;
       --yell:#00ff0d; --blu:#39ff43;
      --face-bg:#000800; --page-bg:#000300;
    }

    /* ── 2. Base layout ──────────────────────────────────────── */
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; }
    body {
      min-height:100vh; min-height:100dvh; overflow:hidden;
      display:grid; place-items:center;
      background:var(--page-bg); color:#ddd; font-family:monospace;
      transition:background .3s;
    }
    .clock-circle {
      position:relative; aspect-ratio:1; container-type:size;
      width:min(88vmin, 750px, calc(100dvh - var(--chrome)));
      border-radius:50%; background:var(--face-bg); box-shadow:0 0 40px #030303;
      transition:border-radius .25s, width .25s, aspect-ratio .25s;
    }
    /* Shared geometry of the rectangular models */
    #circle:is(.model-neon, .model-bars, .model-terminal, .model-hud, .model-sleek) {
      aspect-ratio:var(--ar-w) / var(--ar-h);
      width:min(var(--rect-vw), calc((100dvh - var(--chrome)) * var(--ar-w) / var(--ar-h)), var(--rect-max));
      border-radius:var(--radius);
    }

    /* ── 3. Shared text elements ─────────────────────────────── */
    .digital-clock, .digital-date, .countdown, .signature, .precision-clock, .tz-label {
      position:absolute; left:50%; transform:translate(-50%,-50%);
      text-align:center; white-space:nowrap;
    }
    .digital-clock {
      top:46%; font-size:clamp(1.4rem, 13.6cqmin, 6.5rem); font-weight:400;
      color:var(--green); -webkit-text-stroke:min(1.8px,.05em) #1b1b1b;
      font-variant-numeric:tabular-nums;
    }
    .period {
      font-size: clamp(0.7rem, 6.8cqmin, 3.25rem);font-weight: 200;
      color: var(--green);-webkit-text-stroke: min(1.8px, .05em) #1b1b1b;
      font-variant-numeric: tabular-nums;
    }
    .precision-period {font-size: clamp(0.4rem, 1.25cqmin, 0.75rem); font-weight: 400; margin-left: 0.25em;vertical-align: baseline;}
    .digital-clock.h12 { font-size:clamp(1.1rem, 10.8cqmin, 5.2rem); }
    .digital-clock .ms { display:none; }
    .digital-date {
      z-index:2; top:35%; width:90%; white-space:normal;
      font-size:clamp(.6rem, 4.55cqmin, 2.2rem); font-weight:400;
      color:var(--amber); -webkit-text-stroke:min(1px,.03em) #000;
    }
    .countdown {
      top:65%; font-size:clamp(1.2rem, 7.7cqmin, 3.8rem); font-weight:400;
      color:var(--amber); -webkit-text-stroke:min(.8px,.03em) #000;
      font-variant-numeric:tabular-nums;
    }
    .precision-clock {
      bottom:17%; transform:translate(-50%,50%);
      color:var(--precis); opacity:.75; font-size:clamp(.65rem,2.5cqmin,1.5rem);
      font-variant-numeric:tabular-nums;
    }
    .tz-label {
      bottom:20%; transform:translate(-50%,50%); max-width:70%;
      overflow:hidden; text-overflow:ellipsis;
      color:var(--green); opacity:.7; font-size:clamp(.5rem,2.1cqmin,1rem); letter-spacing:.04em;
    }
    .signature {
      bottom:14%; transform:translate(-50%,50%);
      color:var(--green); opacity:.55; font:clamp(.6rem,1.5cqmin,1rem)/1.2 system-ui,sans-serif;
    }

    /* ── 4. Components ───────────────────────────────────────── */
    /* Progress bar */
    .progress-bar-container {
      position:absolute; z-index:1; top:55%; left:50%; transform:translateX(-50%);
      width:70%; height:10px; border:1px solid #333; border-radius:5px;
      overflow:hidden; background:#222;
    }
    .progress-bar-fill { width:0; height:100%; border-radius:10px 0 0 10px; background:var(--green); }

    /* LEDs */
    .led, .hour-led { position:absolute; border-radius:50%; transform:translate(-50%,-50%); }
    .led      { width:clamp(5px,2cqmin,20px);   height:clamp(5px,2cqmin,20px);   background:var(--sec-off);  transition:background .15s; }
    .hour-led { width:clamp(8px,2.5cqmin,30px); height:clamp(8px,2.5cqmin,30px); background:var(--hour-off); transition:background .15s; }
    .led.on      { background:var(--red); }
    .hour-led.on { background:var(--hour-on); }
    @keyframes blink-fast { 0%,49% { opacity:1; } 50%,100% { opacity:.3; } }
    .led.on.pulse-last10 { animation:blink-fast 1s infinite steps(1); }

    /* Analog hands */
    .analog-hands { position:absolute; inset:0; pointer-events:none; z-index:1; }
    .analog-hand { position:absolute; bottom:50%; transform-origin:center bottom; border-radius:999px 999px 2px 2px; }
    .hour-hand   { width:var(--hour-hand-w); height:24%; left:calc(50% - var(--hour-hand-w) / 2); background:var(--green); box-shadow:0 0 8px color-mix(in srgb, var(--green) 40%, transparent); }
    .minute-hand { width:var(--min-hand-w);  height:32%; left:calc(50% - var(--min-hand-w) / 2);  background:var(--green); box-shadow:0 0 8px color-mix(in srgb, var(--green) 40%, transparent); }
    .second-hand { width:var(--sec-hand-w);  height:40%; left:calc(50% - var(--sec-hand-w) / 2);  background:var(--red);   box-shadow:0 0 10px color-mix(in srgb, var(--red) 60%, transparent); }
    .analog-center {
      position:absolute; top:50%; left:50%; width:12px; height:12px; margin:-6px 0 0 -6px;
      border-radius:50%; background:var(--green); box-shadow:0 0 10px var(--green); z-index:2;
    }

    /* Bars row */
    .bars-row {
      position:absolute; left:6%; right:6%; bottom:8%; height:24%;
      gap:2px; align-items:flex-end; pointer-events:none; z-index:1;
    }
    .bar {
      flex:1 1 0; min-width:0; height:60%; border-radius:2px 2px 0 0;
      background:color-mix(in srgb, var(--green) 15%, transparent);
      transition:background .2s, box-shadow .2s, height .2s;
    }
    .bar.hour-mark { height:80%; background:color-mix(in srgb, var(--green) 30%, transparent); }
    .bar.on { background:var(--green); box-shadow:0 0 8px var(--green), 0 -4px 12px color-mix(in srgb, var(--green) 40%, transparent); }
    .bar.hour-mark.on { background:var(--amber); box-shadow:0 0 10px var(--amber), 0 -4px 14px color-mix(in srgb, var(--amber) 50%, transparent); }

    /* Matrix canvas */
    .matrix-canvas { position:absolute; inset:0; border-radius:50%; pointer-events:none; z-index:0; }

    /* Terminal chrome */
    .term-bar {
      position:absolute; top:0; left:0; right:0; height:30px; align-items:center; gap:14px;
      padding:0 16px; z-index:3; font-size:11px; letter-spacing:.04em;
      color:color-mix(in srgb, var(--green) 70%, #fff);
      background:color-mix(in srgb, var(--green) 10%, transparent);
      border-bottom:1px solid color-mix(in srgb, var(--green) 22%, transparent);
    }
    .term-dots { display:flex; gap:6px; }
    .term-dots span { width:10px; height:10px; border-radius:50%; }
    .term-dots span:nth-child(1) { background:#ff5f57; }
    .term-dots span:nth-child(2) { background:#febc2e; }
    .term-dots span:nth-child(3) { background:#28c840; }
    .term-prompt {
      position:absolute; top:14%; left:6%; align-items:center; gap:6px; z-index:2;
      font-size:clamp(.75rem, 2.8cqmin, 1.2rem); letter-spacing:.02em;
      color:color-mix(in srgb, var(--green) 85%, #fff);
    }
    .term-dollar { color:var(--amber); font-weight:600; }
    .term-cursor {
      position:absolute; bottom:14%; left:6%; width:.6em; height:1.1em; z-index:2;
      background:var(--green); box-shadow:0 0 10px var(--green); animation:term-blink 1s steps(1) infinite;
    }
    @keyframes term-blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }

    /* HUD chrome */
    .hud-frame { position:absolute; inset:0; pointer-events:none; z-index:1; }
    .hud-frame::before {
      content:''; position:absolute; inset:0; pointer-events:none;
      background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.08) 2px, rgba(0,0,0,.08) 4px);
      animation:hud-scan 6s linear infinite;
    }
    @keyframes hud-scan { from { transform:translateY(0); } to { transform:translateY(4px); } }
    .hud-corner { position:absolute; width:36px; height:36px; border:2px solid var(--green); box-shadow:0 0 8px color-mix(in srgb, var(--green) 50%, transparent); }
    .hud-tl { top:16px;    left:16px;  border-right:none; border-bottom:none; }
    .hud-tr { top:16px;    right:16px; border-left:none;  border-bottom:none; }
    .hud-bl { bottom:16px; left:16px;  border-right:none; border-top:none; }
    .hud-br { bottom:16px; right:16px; border-left:none;  border-top:none; }
    .hud-crosshair {
      position:absolute; top:42%; left:50%; width:55%; aspect-ratio:1; transform:translate(-50%,-50%);
      border:1px solid color-mix(in srgb, var(--green) 35%, transparent); border-radius:50%;
      animation:hud-pulse 3s ease-in-out infinite;
    }
    .hud-crosshair::before, .hud-crosshair::after { content:''; position:absolute; background:color-mix(in srgb, var(--green) 45%, transparent); }
    .hud-crosshair::before { top:50%; left:-8%; right:-8%; height:1px; }
    .hud-crosshair::after  { left:50%; top:-8%; bottom:-8%; width:1px; }
    @keyframes hud-pulse { 0%,100% { opacity:.35; } 50% { opacity:.65; } }

    /* Sleek status block */
    .sleek-status { position:absolute; bottom:12%; left:0; right:0; flex-direction:column; align-items:center; gap:6px; z-index:2; }
    .sleek-details {
      font-family:ui-monospace, 'SF Mono', 'Consolas', monospace;
      font-size:clamp(.75rem, 2.2cqmin, 1.1rem); color:#64748b; text-align:center; line-height:1.8;
    }
    .sleek-details span { color:#94a3b8; }

    /* ── 5. Visibility map ───────────────────────────────────────
       Optional elements are hidden by default and switched on
       per model. To add a model, edit only this section.     */
    .led, .hour-led, .countdown, .progress-bar-container, .analog-hands, .matrix-canvas,
    .bars-row, .term-bar, .term-prompt, .term-cursor, .hud-frame, .sleek-status { display:none; }

    #circle:is(.model-room-control, .model-analog, .model-sleek-analog) :is(.led, .hour-led) { display:block; }
    #circle:is(.model-room-control, .model-minimal, .model-terminal, .model-hud) .countdown { display:block; }
    #circle:is(.model-room-control, .model-modern, .model-neon) .progress-bar-container { display:block; }
    #circle:is(.model-analog, .model-sleek-analog) .analog-hands { display:block; }
    #circle.model-matrix   .matrix-canvas { display:block; }
    #circle.model-bars     .bars-row      { display:flex; }
    #circle.model-terminal :is(.term-bar, .term-prompt) { display:flex; }
    #circle.model-terminal .term-cursor   { display:block; }
    #circle.model-hud      .hud-frame     { display:block; }
    #circle.model-sleek    .sleek-status  { display:flex; }

    /* Elements that are visible by default but hidden in some models */
    #circle:is(.model-analog, .model-sleek-analog) .digital-clock,
    #circle.model-sleek-analog .digital-date,
    #circle.model-sleek :is(.precision-clock, .tz-label, .signature) { display:none; }
    #circle.model-sleek ~ .live-status { display:none; }

    /* Text outline is only used by the "classic" looks */
    #circle:is(.model-minimal, .model-neon, .model-bars, .model-matrix, .model-terminal, .model-hud, .model-sleek, .model-big-display)
      :is(.digital-clock, .digital-date, .countdown) { -webkit-text-stroke:0; }

    /* ── 6. models ─────────────────────────────────────────── */

    /* room-control: default look, no overrides needed */

    /* Analog */
    #circle.model-analog .led { width:clamp(3px,1cqmin,6px); height:clamp(3px,1cqmin,6px); background:#333; opacity:.6; }
    #circle.model-analog .led.on { background:var(--red); opacity:1; }
    #circle.model-analog .hour-led { width:clamp(5px,1.6cqmin,10px); height:clamp(5px,1.6cqmin,10px); background:#4a4a4a; opacity:.7; }
    #circle.model-analog .hour-led.on { background:var(--green); opacity:1; }
    #circle.model-analog .digital-date { top:24%; font-size:clamp(.7rem, 3.2cqmin, 1.5rem); }

    /* Sleek Analog */
    #circle.model-sleek-analog { background:var(--face-bg); box-shadow:0 0 40px #030303; }
    #circle.model-sleek-analog .hour-led {
      width:clamp(3px,.8cqmin,5px); height:clamp(12px,3.5cqmin,18px); border-radius:1px;
      background:#5c6f8a; opacity:1; transform:translate(-50%,-50%) rotate(var(--rot, 0deg));
    }
    #circle.model-sleek-analog .hour-led.on { background:#a4bcd6; box-shadow:0 0 8px #a4bcd6; }
    #circle.model-sleek-analog .led {
      width:clamp(2px,.5cqmin,3px); height:clamp(6px,1.8cqmin,10px); border-radius:1px;
      background:#36445c; opacity:1; transform:translate(-50%,-50%) rotate(var(--rot, 0deg));
    }
    #circle.model-sleek-analog .led.on { background:#a4bcd6; }
    #circle.model-sleek-analog .hour-hand   { height:22%; background:#a4bcd6; box-shadow:none; }
    #circle.model-sleek-analog .minute-hand { height:34%; background:#a4bcd6; box-shadow:none; }
    #circle.model-sleek-analog .second-hand { height:38%; background:#ff7b00; box-shadow:none; }
    #circle.model-sleek-analog .analog-center { width:14px; height:14px; margin:-7px 0 0 -7px; background:#ff7b00; box-shadow:none; }
    #circle.model-sleek-analog .tz-label { top:74%; bottom:auto; color:#a4bcd6; opacity:1; font-size:clamp(.6rem,2.2cqmin,1.1rem); letter-spacing:.1em; }
    #circle.model-sleek-analog .precision-clock { top:76.5%; bottom:auto; color:#9e5c1e; opacity:1; font-size:clamp(.7rem,2.5cqmin,1.2rem); }
    #circle.model-sleek-analog .signature { top:80%; bottom:auto; color:#5c6f8a; opacity:.7; font-size:clamp(.5rem,1.5cqmin,.8rem); }

    /* Minimal */
    #circle.model-minimal .digital-clock {
      top:50%; font-size:clamp(1.8rem, 18cqmin, 8.5rem);
      text-shadow:0 0 24px color-mix(in srgb, var(--green) 35%, transparent);
    }
    #circle.model-minimal .digital-clock.h12 { font-size:clamp(1.4rem, 14cqmin, 6.8rem); }
    #circle.model-minimal .digital-date { top:38%; font-size:clamp(.65rem, 3.2cqmin, 1.3rem); opacity:.85; }
    #circle.model-minimal .precision-clock { bottom:24%; font-size:clamp(.55rem, 1.8cqmin, 1rem); }
    #circle.model-minimal .tz-label { bottom:68%; }
    #circle.model-minimal .signature { bottom:22%; }

    /* Modern */
    #circle.model-modern::after {
      content:''; position:absolute; inset:2%; border-radius:50%; pointer-events:none; z-index:0;
      background:conic-gradient(from 0deg,
        var(--modern-color, var(--green)) 0deg,
        var(--modern-color, var(--green)) var(--progress-deg, 0deg),
        rgba(255,255,255,.05) var(--progress-deg, 0deg));
      -webkit-mask:radial-gradient(circle, transparent calc(100% - 10px), #000 calc(100% - 10px));
              mask:radial-gradient(circle, transparent calc(100% - 10px), #000 calc(100% - 10px));
    }
    #circle.model-modern .digital-clock { z-index:1; }
    #circle.model-modern .signature { z-index:1; bottom:26%; }
    #circle.model-modern .precision-clock { bottom:29%; }
    #circle.model-modern .tz-label { bottom:32%; }
    #circle.model-modern .progress-bar-container {
      top:auto; bottom:35%; width:120%; height:20px; border:none;
      background:color-mix(in srgb, var(--green) 15%, transparent);
    }
    #circle.model-modern .progress-bar-fill { border-radius:3px; box-shadow:0 0 8px currentColor; }

    /* Neon */
    #circle.model-neon {
      background:var(--face-bg); overflow:hidden;
      border:1px solid color-mix(in srgb, var(--green) 60%, transparent);
      box-shadow:0 0 50px color-mix(in srgb, var(--green) 20%, transparent),
                 inset 0 0 80px color-mix(in srgb, var(--green) 6%, transparent);
    }
    #circle.model-neon::before {
      content:''; position:absolute; inset:0; pointer-events:none; z-index:0; opacity:.6;
      background-image:
        repeating-linear-gradient(0deg,  transparent, transparent 19px, color-mix(in srgb, var(--green) 8%, transparent) 19px, color-mix(in srgb, var(--green) 8%, transparent) 20px),
        repeating-linear-gradient(90deg, transparent, transparent 19px, color-mix(in srgb, var(--green) 8%, transparent) 19px, color-mix(in srgb, var(--green) 8%, transparent) 20px);
    }
    #circle.model-neon::after {
      content:''; position:absolute; inset:0; pointer-events:none; z-index:3;
      background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.18) 2px, rgba(0,0,0,.18) 4px);
      animation:scan 8s linear infinite;
    }
    @keyframes scan { from { transform:translateY(0); } to { transform:translateY(20px); } }
    #circle.model-neon .digital-clock {
      top:48%; z-index:1; font-size:clamp(2rem, 18cqmin, 7rem);
      text-shadow:0 0 24px var(--green), 0 0 48px color-mix(in srgb, var(--green) 40%, transparent);
    }
    #circle.model-neon .digital-clock.h12 { font-size:clamp(1.5rem, 14cqmin, 5.5rem); }
    #circle.model-neon .digital-date {
      top:10%; left:5%; transform:none; text-align:left; z-index:2;
      font-size:clamp(.6rem, 2.8cqmin, 1.1rem); letter-spacing:.08em;
    }
    #circle.model-neon .precision-clock { bottom:22%; left:5%; transform:none; text-align:left; z-index:2; font-size:clamp(.55rem, 1.8cqmin, 1rem); }
    #circle.model-neon .tz-label { bottom:22%; left:auto; right:5%; transform:none; text-align:right; max-width:45%; z-index:2; }
    #circle.model-neon .signature { top:5%; bottom:auto; left:auto; right:5%; transform:none; opacity:.4; z-index:2; font-size:clamp(.5rem, 1.4cqmin, .8rem); }
    #circle.model-neon .progress-bar-container {
      top:auto; bottom:8%; left:5%; right:5%; width:auto; transform:none; height:3px; z-index:2;
      border:none; border-radius:0; background:color-mix(in srgb, var(--green) 15%, transparent);
    }
    #circle.model-neon .progress-bar-fill { border-radius:0; box-shadow:0 0 8px var(--green); }

    /* Bars */
    #circle.model-bars { background:var(--face-bg); border:1px solid color-mix(in srgb, var(--green) 25%, transparent); }
    #circle.model-bars .digital-clock {
      top:40%; font-size:clamp(1.8rem, 13cqmin, 5rem);
      text-shadow:0 0 12px color-mix(in srgb, var(--green) 30%, transparent);
    }
    #circle.model-bars .digital-clock.h12 { font-size:clamp(1.4rem, 10cqmin, 4rem); }
    #circle.model-bars .digital-date { top:12%; font-size:clamp(.6rem, 3cqmin, 1.2rem); }
    #circle.model-bars .precision-clock { top:58%; bottom:auto; font-size:clamp(.55rem, 1.9cqmin, 1rem); }
    #circle.model-bars .tz-label { top:22%; bottom:auto; font-size:clamp(.5rem, 1.8cqmin, .85rem); }
    #circle.model-bars .signature { bottom:2%; opacity:.35; font-size:clamp(.5rem, 1.2cqmin, .75rem); }

    /* Matrix */
    #circle.model-matrix .digital-clock {
      z-index:3; -webkit-text-stroke:min(2px,.04em) #000;
      text-shadow:0 0 20px var(--green), 0 0 40px var(--green), 0 0 60px color-mix(in srgb, var(--green) 60%, transparent);
    }
    #circle.model-matrix .digital-date { z-index:3; text-shadow:0 0 10px var(--amber); }
    #circle.model-matrix :is(.precision-clock, .tz-label, .signature) { z-index:3; }

    /* Terminal */
    #circle.model-terminal {
      --ar-w:16; --ar-h:10; --rect-vw:92vw; --rect-max:860px; --radius:10px;
      background:color-mix(in srgb, var(--face-bg) 85%, var(--green) 15%); overflow:hidden;
      border:1px solid color-mix(in srgb, var(--green) 40%, transparent);
      box-shadow:0 0 40px color-mix(in srgb, var(--green) 15%, transparent), inset 0 0 100px color-mix(in srgb, var(--green) 3%, transparent);
      font-family:ui-monospace, 'SF Mono', 'Consolas', 'Courier New', monospace;
    }
    #circle.model-terminal::after {
      content:''; position:absolute; inset:0; pointer-events:none; z-index:10;
      background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.08) 2px, rgba(0,0,0,.08) 4px);
    }
    @keyframes terminal-glow {
      0%,100% { text-shadow:0 0 12px color-mix(in srgb, var(--green) 40%, transparent); }
      50%     { text-shadow:0 0 22px color-mix(in srgb, var(--green) 75%, transparent); }
    }
    #circle.model-terminal .digital-clock {
      top:34%; left:6%; transform:none; text-align:left; z-index:2;
      font-size:clamp(1.6rem, 8cqmin, 3.4rem); animation:terminal-glow 3s ease-in-out infinite;
    }
    #circle.model-terminal .digital-clock.h12 { font-size:clamp(1.3rem, 6.5cqmin, 2.8rem); }
    #circle.model-terminal .tz-label {
      top:47%; bottom:auto; left:6%; right:auto; transform:none; text-align:left; max-width:50%; z-index:2;
      color:color-mix(in srgb, var(--green) 60%, #fff); opacity:.85; font-size:clamp(.6rem, 2cqmin, .9rem); letter-spacing:.1em;
    }
    #circle.model-terminal .digital-date {
      top:60%; left:6%; transform:none; text-align:left; width:auto; white-space:nowrap; z-index:2;
      font-size:clamp(.7rem, 2.5cqmin, 1.1rem);
    }
    #circle.model-terminal .countdown { top:68%; left:6%; transform:none; text-align:left; opacity:.85; z-index:2; font-size:clamp(.65rem, 2.2cqmin, 1rem); }
    #circle.model-terminal .countdown::before { content:'→ '; color:var(--amber); }
    #circle.model-terminal .precision-clock {
      bottom:8%; left:6%; transform:none; text-align:left; z-index:2;
      color:color-mix(in srgb, var(--green) 55%, #fff); opacity:.7; font-size:clamp(.55rem, 1.8cqmin, .85rem);
    }
    #circle.model-terminal .precision-clock::before { content:'› '; color:var(--amber); }
    #circle.model-terminal .signature { bottom:8%; left:auto; right:6%; transform:none; text-align:right; opacity:.4; z-index:2; font-size:clamp(.5rem, 1.4cqmin, .75rem); }

    /* HUD */
    #circle.model-hud {
      --ar-w:16; --ar-h:10; --rect-vw:92vw; --rect-max:860px; --radius:12px;
      background:color-mix(in srgb, var(--face-bg) 88%, var(--green) 12%); overflow:hidden;
      border:1px solid color-mix(in srgb, var(--green) 30%, transparent);
      box-shadow:0 0 50px color-mix(in srgb, var(--green) 12%, transparent), inset 0 0 100px color-mix(in srgb, var(--green) 2%, transparent);
    }
    #circle.model-hud .digital-clock {
      top:42%; z-index:3; font-size:clamp(1.8rem, 10cqmin, 4rem);
      text-shadow:0 0 20px color-mix(in srgb, var(--green) 60%, transparent);
    }
    #circle.model-hud .digital-clock.h12 { font-size:clamp(1.4rem, 8cqmin, 3.2rem); }
    #circle.model-hud .countdown { top:60%; z-index:3; opacity:.9; font-size:clamp(.9rem, 4cqmin, 1.6rem); }
    #circle.model-hud .digital-date {
      top:7%; left:4%; transform:none; text-align:left; width:auto; white-space:nowrap; z-index:3;
      color:color-mix(in srgb, var(--green) 70%, #fff); font-size:clamp(.6rem, 2cqmin, .9rem); letter-spacing:.06em;
    }
    #circle.model-hud .tz-label {
      top:7%; bottom:auto; left:auto; right:4%; transform:none; text-align:right; max-width:40%; z-index:3;
      color:color-mix(in srgb, var(--green) 70%, #fff); opacity:.7; font-size:clamp(.6rem, 2cqmin, .9rem); letter-spacing:.06em;
    }
    #circle.model-hud .precision-clock {
      bottom:7%; left:4%; transform:none; text-align:left; z-index:3;
      color:color-mix(in srgb, var(--green) 60%, #fff); opacity:.75; font-size:clamp(.55rem, 1.8cqmin, .85rem);
    }
    #circle.model-hud .signature { bottom:7%; left:auto; right:4%; transform:none; text-align:right; opacity:.4; z-index:3; font-size:clamp(.5rem, 1.4cqmin, .75rem); }

    /* Sleek */
    #circle.model-sleek {
      --radius:12px;
      background:#0d0d0d; border:1px solid #1f1f1f; box-shadow:0 10px 40px rgba(0,0,0,.5);
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #circle.model-sleek .digital-date {
      top:22%; width:auto; white-space:nowrap;
      color:#7a7f87; font-size:clamp(1rem, 2.8cqmin, 1.4rem); font-weight:500;
      letter-spacing:.15em; text-transform:uppercase;
    }
    #circle.model-sleek .digital-clock {
      top:45%; font-size:clamp(4rem, 22cqmin, 11rem);
      color:#f8fafc; font-weight:300; letter-spacing:-.02em;
    }
    #circle.model-sleek .digital-clock.h12 { font-size:clamp(3rem, 18cqmin, 8.5rem); }
    #circle.model-sleek .digital-clock .ms { display:inline; color:#64748b; font-size:.6em; font-weight:400; letter-spacing:0; }
    #circle.model-sleek .digital-clock .period { color:#94a3b8; font-size:.45em; font-weight:500; margin-left:8px; letter-spacing:.05em; }

    /* Big Display – time fills almost the whole screen, everything else is small */
    #circle.model-big-display {
      aspect-ratio:auto; width:98vw; height:calc(100dvh - var(--chrome));
      border-radius:12px; background:var(--face-bg);
      border:1px solid color-mix(in srgb, var(--blu) 25%, transparent);
    }
    #circle.model-big-display .digital-clock {
      top:50%; font-size:min(17.5cqw, 55cqh); line-height:1; letter-spacing:0;
      text-shadow:0 0 30px color-mix(in srgb, var(--blu) 40%, transparent);
    }
    #circle.model-big-display .digital-clock.h12 { font-size:min(14.5cqw, 50cqh);color:var(--yell) }
    #circle.model-big-display .digital-clock .period { font-size:.3em; margin-left:.25em; color: var(--yell) }
    #circle.model-big-display .digital-date {
      top:5%; left:3%; transform:none; width:auto; white-space:nowrap; text-align:left;
      font-size:max(.8rem, min(2.6cqw, 5cqh)); color: var(--blu);
    }
    #circle.model-big-display .tz-label {
      top:5%; bottom:auto; left:auto; right:3%; transform:none; text-align:right; max-width:40%;
      font-size:max(.7rem, min(2cqw, 4cqh)); opacity:.8; color:var(--yell)
    }
    #circle.model-big-display .precision-clock {
      bottom:4%; left:3%; transform:none; text-align:left;
      font-size:max(.65rem, min(1.8cqw, 3.5cqh));
    }
    #circle.model-big-display .signature {
      bottom:4%; left:auto; right:3%; transform:none; text-align:right; opacity:.4;
      font-size:max(.55rem, min(1.2cqw, 2.5cqh)); color: var(--blu);
    }

    /* ── 7. UI: settings & status bar ────────────────────────── */
    .settings-button {
      position:fixed; z-index:5; top:14px; right:16px; width:42px; height:42px;
      border:1px solid #484848; border-radius:50%; background:#111e; color:#ddd; font-size:20px; cursor:pointer;
    }
    .settings-panel {
      position:fixed; z-index:6; top:64px; right:16px; width:min(340px, calc(100vw - 32px));
      max-height:calc(100vh - 80px); overflow-y:auto; padding:16px 18px;
      border:1px solid #494949; border-radius:10px; background:#101210f2; color:#eee;
      box-shadow:0 14px 44px #000c; backdrop-filter:blur(4px); font:14px/1.4 system-ui,sans-serif;
    }
    .settings-panel[hidden] { display:none; }
    .settings-panel h2 { margin:0 0 10px; font-size:14px; color:#aab3ad; font-weight:600; letter-spacing:.03em; text-transform:uppercase; }
    .setting-row { display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:12px; margin-top:10px; }
    .setting-row.pulse-row { grid-template-columns:1fr auto; }
    .setting-row label { color:#aab3ad; font-size:12px; }
    .setting-row select { width:100%; min-width:0; min-height:34px; padding:0 8px; border:1px solid #444; border-radius:6px; background:#080a09; color:#eee; }
    .pulse-toggle { appearance:none; position:relative; width:38px; height:22px; border-radius:12px; background:#3b423d; cursor:pointer; transition:background .15s; }
    .pulse-toggle::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#ddd; transition:transform .15s; }
    .pulse-toggle:checked { background:#078d32; }
    .pulse-toggle:checked::after { transform:translateX(16px); background:#fff; }
    .resync-button {
      margin-top:14px; width:100%; padding:8px 10px; border:1px solid #444; border-radius:6px;
      background:#0f1311; color:#cfd8d2; font:13px system-ui,sans-serif; cursor:pointer;
    }
    .resync-button:hover { background:#171d19; }
    .resync-button:disabled { opacity:.5; cursor:wait; }

    .live-status {
      position:fixed; z-index:4; left:0; right:0; bottom:10px; margin:0 auto;
      width:fit-content; max-width:calc(100vw - 16px);
      display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:4px 10px;
      padding:6px 12px; border:1px solid #253028; border-radius:6px; background:#080b0aee;
      color:#aab5ad; font:12px/1.3 monospace; font-variant-numeric:tabular-nums; box-shadow:0 4px 16px #000a;
    }
    .status-main { display:flex; align-items:center; gap:8px; min-width:0; max-width:100%; }
    .status-metrics { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:2px 10px; min-width:0; }
    .live-status i { flex:0 0 auto; width:8px; height:8px; border-radius:50%; background:#777; }
    .live-status i.ok   { background:var(--green); box-shadow:0 0 6px var(--green); }
    .live-status i.warn { background:var(--amber); }
    .live-status i.bad  { background:var(--red); }
    .live-status i.busy {background:var(--amber);animation:sync-pulse 1s ease-in-out infinite;}
     @keyframes sync-pulse {0%, 100% { opacity:.35; box-shadow:0 0 0 transparent; }50%      { opacity:1; box-shadow:0 0 8px var(--amber); }}
    .live-status #syncText { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
    .live-status .metric { flex:0 0 auto; white-space:nowrap; color:#7a8a80; }
    .live-status .metric b { font-weight:500; }
    .live-status .metric b.q-excellent { color:var(--green); }
    .live-status .metric b.q-good      { color:var(--amber); }
    .live-status .metric b.q-weak      { color:var(--red); }
    .live-status .divider { color:#3a4540; }
    .status-metrics[hidden], .metric[hidden], .divider[hidden] { display:none; }

    /* ── 8. Responsive ───────────────────────────────────────── */
    @media (max-width:720px) {
      .live-status .divider { display:none; }
    }
    @media (max-width:600px) {
      :root { --chrome:88px; --hour-hand-w:4px; --min-hand-w:3px; --sec-hand-w:1.5px; }
      .clock-circle { width:min(96vmin, 96vw, calc(100dvh - var(--chrome))); }
      #circle:is(.model-neon, .model-bars, .model-terminal, .model-hud, .model-sleek) {
        --ar-w:4; --ar-h:3; --rect-vw:94vw; --rect-max:600px;
      }
      .progress-bar-container { height:8px; }
      .live-status { font-size:11px; gap:3px 8px; padding:5px 10px; }
    }
    @media (max-width:380px) {
      .live-status { font-size:10px; }
    }
  </style>
</head>

        sec,
        color:  sec >= 50 ? themeColors.red : sec >= 30 ? themeColors.amber : themeColors.green
      };

      clkHms.textContent    = clk.hms;
      clkPeriod.textContent = clk.suffix;

      const dateText = fmtDate.format(date);
      if (dateText !== lastDateText) { digitalDate.textContent = dateText; lastDateText = dateText; }

      countdown.textContent = String((60 - sec) % 60).padStart(2, '0');
      countdown.style.color = clk.color;
      progressFill.style.backgroundColor = clk.color;
      if (model === 'modern') circle.style.setProperty('--modern-color', clk.color);

      updateIndicators(sec);
    }

    function updateIndicators(sec) {
      if (ANALOG_models.has(model)) {
        secondLeds.forEach((led, i) => { led.classList.toggle('on', i === sec); led.classList.remove('pulse-last10'); });
        hourLeds.forEach((led, i) => led.classList.toggle('on', i === clk.h12));
      } else if (model === 'room-control') {
        secondLeds.forEach((led, i) => {
          const on = i <= sec;
          led.classList.toggle('on', on);
          led.classList.toggle('pulse-last10', pulseEnabled && on && sec >= 50);
        });
        const litHours = Math.floor(sec / 5);
        hourLeds.forEach((led, i) => led.classList.toggle('on', i <= litHours));
      } else if (model === 'bars') {
        bars.forEach((bar, i) => bar.classList.toggle('on', i <= sec));
      }
    }

    function render() {
      requestAnimationFrame(render);

      if (targetOffset === null) {
        if (model === 'matrix') drawMatrixRain(themeColors.green);
        return;
      }

      const now    = performance.now();
      const utcMs  = now + targetOffset;
      const epoch  = Math.floor(utcMs / 1000);
      if (epoch !== lastEpochSec) { lastEpochSec = epoch; onSecond(epoch); }

      const ms     = Math.floor(utcMs - epoch * 1000);
      const msText = String(ms).padStart(3, '0');
      const s      = clk.sec + ms / 1000;

      if (model === 'sleek') {clkMs.textContent = '.' + msText;
           } else {
          precisionTime.textContent = `${clk.hms}.${msText}`;
          precisionPeriod.textContent = clk.suffix;
        }

      if (PROGRESS_models.has(model)) {
        const progress = s / 60;
        progressFill.style.width = `${progress * 100}%`;
        if (model === 'modern') circle.style.setProperty('--progress-deg', `${progress * 360}deg`);
      }

      if (ANALOG_models.has(model)) {
        hourHandEl.style.transform   = `rotate(${(clk.h12 + clk.min / 60) * 30}deg)`;
        minuteHandEl.style.transform = `rotate(${(clk.min + s / 60) * 6}deg)`;
        secondHandEl.style.transform = `rotate(${s * 6}deg)`;
      }

      if (model === 'matrix') {
        const flash = pulseEnabled && clk.sec >= 50 && (Math.floor(now / 500) % 2 === 0);
        drawMatrixRain(flash ? themeColors.red : themeColors.green);
      }
    }

    /* ═══ 12. INIT & EVENTS ═══════════════════════════════════ */
    const zones = Intl.supportedValuesOf ? Intl.supportedValuesOf('timeZone') : [];
    for (const z of zones) {
      if (z === 'UTC') continue;
      const opt = document.createElement('option');
      opt.value = opt.textContent = z;
      timezoneSelect.appendChild(opt);
    }
    if (selectedZone !== 'UTC' && selectedZone !== 'DEVICE' && !zones.includes(selectedZone)) selectedZone = 'UTC';

    timezoneSelect.value   = selectedZone;
    languageSelect.value   = language;
    hourFormatSelect.value = hourFormat;
    pulseToggle.checked    = pulseEnabled;
    modelselect.value    = model;
    themeSelect.value      = theme;

    addLeds(60, 40, 'led', secondLeds);
    addLeds(12, 47, 'hour-led', hourLeds);
    {
      const frag = document.createDocumentFragment();
      for (let i = 0; i < 60; i++) {
        const bar = document.createElement('span');
        bar.className = 'bar' + (i % 5 === 0 ? ' hour-mark' : '');
        frag.appendChild(bar);
        bars.push(bar);
      }
      barsRow.appendChild(frag);
    }

    applyTheme();
    applymodel();
    rebuildFormatters();
    applyI18n();

    new ResizeObserver(resizeMatrix).observe(matrixCanvas);

    function setPanel(open) {
      settingsPanel.hidden = !open;
      settingsButton.setAttribute('aria-expanded', String(open));
    }
    settingsButton.addEventListener('click', () => setPanel(settingsPanel.hidden));
    document.addEventListener('click', e => {
      if (!settingsPanel.hidden && !settingsPanel.contains(e.target) && !settingsButton.contains(e.target)) setPanel(false);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setPanel(false); });

    modelselect.addEventListener('change', () => {
      model = modelselect.value;
      store.set('masterclock-model', model);
      applymodel();
    });
    themeSelect.addEventListener('change', () => {
      theme = themeSelect.value;
      store.set('masterclock-theme', theme);
      applyTheme();
    });
    languageSelect.addEventListener('change', () => {
      language = languageSelect.value;
      store.set('masterclock-lang', language);
      applyI18n();
      rebuildFormatters();
    });
    timezoneSelect.addEventListener('change', () => {
      selectedZone = timezoneSelect.value;
      store.set('masterclock-timezone', selectedZone);
      rebuildFormatters();
    });
    hourFormatSelect.addEventListener('change', () => {
      hourFormat = hourFormatSelect.value;
      store.set('masterclock-hourformat', hourFormat);
      rebuildFormatters();
    });
    pulseToggle.addEventListener('change', () => {
      pulseEnabled = pulseToggle.checked;
      store.set('masterclock-pulse', String(pulseEnabled));
      invalidate();
    });
    resyncButton.addEventListener('click', () => synchronize());

    // After sleep / long background, performance.now() may have stopped while Date.now() kept going.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden || targetOffset === null || syncing) return;
      const drift = (performance.now() + targetOffset) - Date.now() - deviceOffsetMs;
      if (Math.abs(drift) > WAKE_DRIFT_MS) synchronize();
    });

    render();
    synchronize();
  </script>
</body>
</html>
