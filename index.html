<html lang="en" data-theme="classic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050607">
  <title>MasterClock Broadcast</title>
  <style>
    /* ═══════════════════════════════════════════════════════════
       INDEX
       1. Tokens & Broadcast Themes
       2. Base Layout
       3. Shared Text Elements
       4. Components (LEDs, Hands, Bars, World Grid)
       5. Visibility Map
       6. Models
       7. UI (Settings & Status Bar)
       8. Responsive
       ═══════════════════════════════════════════════════════════ */

    /* ── 1. Tokens & Broadcast Themes ────────────────────────── */
    :root {
      --chrome: 92px;
      --hour-hand-w: 6px;
      --min-hand-w: 4px;
      --sec-hand-w: 2px;
      --ar-w: 16;
      --ar-h: 9;
      --rect-vw: 94vw;
      --rect-max: 1040px;
      --radius: 14px;
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    /* 1. Broadcast Classic (Phosphor Green / Amber / Tally Red) */
    :root, html[data-theme="classic"] {
      --green: #0edf46;
      --amber: #ff9100;
      --red: #ff0000;
      --precis: #a8a7a7;
      --tz: #0197c5;
      --sig: #ff96c2;
      --hour-on: #0FFF50;
      --hour-off: #0f3d25;
      --sec-off: #4b0611;
      --accent-soft: #00ff843b;
      --face-bg: #080a09;
      --card-bg: #0d110f;
      --page-bg: #030404;
    }

    /* 2. EBU / Tally Studio (Deep Slate + Broadcast Emerald & Tally Red) */
    html[data-theme="ebu"] {
      --green: #2ceaa3;
      --amber: #f59e0b;
      --red: #ef4444;
      --precis: #8b9bb4;
      --tz: #40cc99;
      --sig: #b9e4d4;
      --hour-on: #10b981;
      --hour-off: #194139;
      --sec-off: #571015;
      --accent-soft: #2ceaa43f;
      --face-bg: #0b0f14;
      --card-bg: #111720;
      --page-bg: #06090d;
    }

    /* 3. Playout Amber (Low-glare Control Room Amber) */
    html[data-theme="amber"] {
      --green: #ffb300;
      --amber: #ff6d00;
      --red: #ff2a2a;
      --precis: #a89984;
      --tz: #faa66e;
      --sig: #f8ff96;
      --hour-on: #ff9100;
      --hour-off: #382400;
      --sec-off: #471212;
      --accent-soft: rgba(255, 179, 0, 0.13);
      --face-bg: #0c0905;
      --card-bg: #140f08;
      --page-bg: #050402;
    }

    /* 4. Telemetry Cyan (Routing / Sync / NTP Rack Blue) */
    html[data-theme="cyan"] {
      --green: #38bdf8;
      --amber: #fbbf24;
      --red: #f43f5e;
      --precis: #94a3b8;
      --hour-on: #0284c7;
      --hour-off: #0c354d;
      --sec-off: #451220;
      --accent-soft: rgba(56, 189, 248, 0.13);
      --face-bg: #070d14;
      --card-bg: #0c1521;
      --page-bg: #03070c;
    }

    /* 5. Studio Mono (Neutral Reference White + Tally Red) */
    html[data-theme="mono"] {
      --green: #f1f5f9;
      --amber: #94a3b8;
      --red: #ff2e4c;
      --precis: #64748b;
      --tz: #e0e0e0;
      --sig: #c0bcff;
      --hour-on: #cbd5e1;
      --hour-off: #1e293b;
      --sec-off: #3b1219;
      --accent-soft: rgba(241, 245, 249, 0.10);
      --face-bg: #0a0a0c;
      --card-bg: #121316;
      --page-bg: #040405;
    }

    /* ── 2. Base Layout ──────────────────────────────────────── */
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: var(--page-bg);
      color: #e2e8f0;
      font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Consolas', monospace;
      transition: background .25s ease;
    }

    .clock-circle {
      position: relative;
      aspect-ratio: 1;
      container-type: size;
      width: min(88vmin, 760px, calc(100dvh - var(--chrome)));
      border-radius: 50%;
      background: var(--face-bg);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.75);
      transition: border-radius .2s, width .2s, aspect-ratio .2s, background .25s;
    }

    /* Frameless round clocks: no circle background, no border, no circle shadow */
    #circle:is(.model-room-control, .model-analog, .model-sleek-analog) {
      background: transparent;
      border: none;
      box-shadow: none;
    }

    /* Rectangular broadcast models */
    #circle:is(.model-bars, .model-sleek, .model-world) {
      aspect-ratio: var(--ar-w) / var(--ar-h);
      width: min(var(--rect-vw), calc((100dvh - var(--chrome)) * var(--ar-w) / var(--ar-h)), var(--rect-max));
      border-radius: var(--radius);
    }

    /* ── 3. Shared Text Elements ─────────────────────────────── */
    .digital-clock, .digital-date, .countdown, .signature, .precision-clock, .tz-label {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      white-space: nowrap;
    }

    .digital-clock {
      top: 46%;
      font-size: clamp(1.4rem, 13.6cqmin, 6.5rem);
      font-weight: 500;
      color: var(--green);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .period {
      font-size: clamp(0.7rem, 5.5cqmin, 2.8rem);
      font-weight: 400;
      color: var(--green);
      margin-left: 0.2em;
      font-variant-numeric: tabular-nums;
    }
    .precision-period {
      font-size: clamp(0.45rem, 1.3cqmin, 0.75rem);
      font-weight: 400;
      margin-left: 0.25em;
    }
    .digital-clock.h12 { font-size: clamp(1.1rem, 10.6cqmin, 5.1rem); }
    .digital-clock .ms { display: none; }

    .digital-date {
      z-index: 2;
      top: 34.5%;
      width: 90%;
      white-space: normal;
      font-size: clamp(.6rem, 4.1cqmin, 1.9rem);
      font-weight: 400;
      color: var(--amber);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .countdown {
      top: 65%;
      font-size: clamp(1.2rem, 7.6cqmin, 3.7rem);
      font-weight: 500;
      color: var(--amber);
      font-variant-numeric: tabular-nums;
    }

    .precision-clock {
      bottom: 18%;
      transform: translate(-50%, 50%);
      color: var(--precis);
      opacity: .8;
      font-size: clamp(.65rem, 2.3cqmin, 1.35rem);
      font-variant-numeric: tabular-nums;
    }

    .tz-label {
      bottom: 21%;
      transform: translate(-50%, 50%);
      max-width: 72%;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--tz);
      opacity: .70;
      font-size: clamp(.5rem, 2cqmin, .95rem);
      letter-spacing: .08em;
    }

    .signature {
      bottom: 15%;
      transform: translate(-50%, 50%);
      color: var(--sig);
      opacity: .45;
      font: 500 clamp(.55rem, 1.4cqmin, .85rem)/1.2 system-ui, -apple-system, sans-serif;
      letter-spacing: 0.08em;
      /*text-transform: uppercase;*/
    }

    /* ── 4. Components ───────────────────────────────────────── */
    /* Progress bar */
    .progress-bar-container {
      position: absolute;
      z-index: 1;
      top: 55.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 68%;
      height: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.04);
    }
    .progress-bar-fill {
      width: 0;
      height: 100%;
      border-radius: 3px 0 0 3px;
      background: var(--green);
    }

    /* LEDs */
    .led, .hour-led {
      position: absolute;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .led {
      width: clamp(5px, 1.9cqmin, 18px);
      height: clamp(5px, 1.9cqmin, 18px);
      background: var(--sec-off);
      transition: background .12s;
    }
    .hour-led {
      width: clamp(8px, 2.4cqmin, 26px);
      height: clamp(8px, 2.4cqmin, 26px);
      background: var(--hour-off);
      transition: background .12s;
    }
    .led.on {
      background: var(--red);
      box-shadow: 0 0 8px color-mix(in srgb, var(--red) 65%, transparent);
    }
    .hour-led.on {
      background: var(--hour-on);
      box-shadow: 0 0 8px color-mix(in srgb, var(--hour-on) 55%, transparent);
    }
    @keyframes blink-fast { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .28; } }
    .led.on.pulse-last10 { animation: blink-fast 1s infinite steps(1); }

    /* Analog hands */
    .analog-hands { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    .analog-hand { position: absolute; bottom: 50%; transform-origin: center bottom; border-radius: 999px 999px 2px 2px; }
    .hour-hand {
      width: var(--hour-hand-w); height: 24%; left: calc(50% - var(--hour-hand-w) / 2);
      background: var(--green);
    }
    .minute-hand {
      width: var(--min-hand-w); height: 33%; left: calc(50% - var(--min-hand-w) / 2);
      background: var(--green);
    }
    .second-hand {
      width: var(--sec-hand-w); height: 40%; left: calc(50% - var(--sec-hand-w) / 2);
      background: var(--red);
    }
    .analog-center {
      position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px;
      border-radius: 50%; background: var(--red); z-index: 2;
    }

    /* Bars row */
    .bars-row {
      position: absolute;
      left: 5%;
      right: 5%;
      bottom: 8%;
      height: 24%;
      gap: 3px;
      align-items: flex-end;
      pointer-events: none;
      z-index: 1;
    }
    .bar {
      flex: 1 1 0;
      min-width: 0;
      height: 58%;
      border-radius: 2px 2px 0 0;
      background: color-mix(in srgb, var(--green) 14%, transparent);
      transition: background .15s, height .15s;
    }
    .bar.hour-mark {
      height: 82%;
      background: color-mix(in srgb, var(--green) 28%, transparent);
    }
    .bar.on {
      background: var(--green);
    }
    .bar.hour-mark.on {
      background: var(--amber);
    }
    .bar.last10.on {
      background: var(--red);
    }

    /* Sleek status block */
    .sleek-status {
      position: absolute;
      bottom: 10%;
      left: 0;
      right: 0;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }
    .sleek-details {
      font-size: clamp(.72rem, 2cqmin, 1rem);
      color: var(--precis);
      text-align: center;
      line-height: 1.75;
    }
    .sleek-details span { color: var(--green); font-weight: 500; }

    /* World Hubs Layout (Studio Master + 6 Global Clocks) */
    .world-layout {
      position: absolute;
      inset: 0;
      padding: clamp(14px, 3cqmin, 28px);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(12px, 2.5cqmin, 22px);
      z-index: 2;
    }
    .world-master {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: clamp(10px, 2cqmin, 20px);
      position: relative;
    }
    .world-master-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(.65rem, 1.8cqmin, .95rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 4px;
    }
    .world-tally-badge {
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.78em;
      font-weight: 700;
      background: var(--accent-soft);
      color: var(--green);
      border: 1px solid color-mix(in srgb, var(--green) 35%, transparent);
    }
    .world-master-time {
      font-size: clamp(2.4rem, 11.5cqmin, 5.8rem);
      font-weight: 600;
      color: var(--green);
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .world-master-time .w-ms {
      font-size: 0.45em;
      color: var(--precis);
      font-weight: 400;
    }
    .world-master-time .w-period {
      font-size: 0.38em;
      color: var(--amber);
      margin-left: 0.25em;
    }
    .world-master-sub {
      margin-top: 6px;
      font-size: clamp(.65rem, 1.8cqmin, .95rem);
      color: var(--precis);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .world-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: clamp(8px, 1.5cqmin, 14px);
    }
    .world-card {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: clamp(8px, 1.6cqmin, 14px) clamp(6px, 1.2cqmin, 12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-width: 0;
    }
    .world-card-city {
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: clamp(.72rem, 1.75cqmin, .98rem);
      font-weight: 600;
      color: var(--amber);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .world-card-time {
      margin: 4px 0 2px;
      font-size: clamp(1rem, 3.1cqmin, 1.65rem);
      font-weight: 500;
      color: var(--green);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .world-card-meta {
      font-size: clamp(.75rem, 1.65cqmin, .95rem);
      color: var(--precis);
      white-space: nowrap;
    }

    /* ── 5. Visibility Map ─────────────────────────────────────── */
    .led, .hour-led, .countdown, .progress-bar-container, .analog-hands,
    .bars-row, .sleek-status, .world-layout { display: none; }

    #circle:is(.model-room-control, .model-analog, .model-sleek-analog) :is(.led, .hour-led) { display: block; }
    #circle.model-room-control .countdown { display: block; }
    #circle.model-room-control .progress-bar-container { display: block; }
    #circle:is(.model-analog, .model-sleek-analog) .analog-hands { display: block; }
    #circle.model-bars .bars-row { display: flex; }
    #circle.model-sleek .sleek-status { display: flex; }
    #circle.model-world .world-layout { display: flex; }

    /* Hide default single-clock nodes when model-world or analog is active */
    #circle:is(.model-analog, .model-sleek-analog) .digital-clock,
    #circle.model-sleek-analog .digital-date,
    #circle.model-sleek :is(.precision-clock, .tz-label, .signature),
    #circle.model-world :is(.digital-clock, .digital-date, .precision-clock, .tz-label, .signature) {
      display: none;
    }
    #circle.model-sleek ~ .live-status { display: none; }

    /* ── 6. Models ───────────────────────────────────────────── */
    /* Analog */
    #circle.model-analog .led { width: clamp(3px, 1cqmin, 6px); height: clamp(3px, 1cqmin, 6px); background: var(--sec-off); opacity: .75; }
    #circle.model-analog .led.on { background: var(--red); opacity: 1; }
    #circle.model-analog .hour-led { width: clamp(5px, 1.6cqmin, 10px); height: clamp(5px, 1.6cqmin, 10px); background: var(--hour-off); opacity: .85; }
    #circle.model-analog .hour-led.on { background: var(--green); opacity: 1; }
    #circle.model-analog .digital-date { top: 26%; font-size: clamp(.65rem, 2.8cqmin, 1.3rem); }
    #circle.model-analog .signature { top: 19.5%; bottom: auto; transform: translate(-50%, -50%); opacity: .65; }

    /* Sleek Analog */
    #circle.model-sleek-analog .hour-led {
      width: clamp(3px, .8cqmin, 5px); height: clamp(12px, 3.5cqmin, 18px); border-radius: 1px;
      background: var(--hour-off); opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
    }
    #circle.model-sleek-analog .hour-led.on { background: var(--green); }
    #circle.model-sleek-analog .led {
      width: clamp(2px, .5cqmin, 3px); height: clamp(6px, 1.8cqmin, 10px); border-radius: 1px;
      background: var(--sec-off); opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
    }
    #circle.model-sleek-analog .led.on { background: var(--amber); }
    #circle.model-sleek-analog .hour-hand   { height: 22%; background: var(--green); }
    #circle.model-sleek-analog .minute-hand { height: 34%; background: var(--green); }
    #circle.model-sleek-analog .second-hand { height: 39%; background: var(--red); }
    #circle.model-sleek-analog .analog-center { width: 12px; height: 12px; margin: -6px 0 0 -6px; background: var(--red); }
    #circle.model-sleek-analog .tz-label { top: 72%; bottom: auto; color: var(--green); opacity: .9; font-size: clamp(.6rem, 2.1cqmin, 1rem); letter-spacing: .1em; }
    #circle.model-sleek-analog .precision-clock { top: 76.5%; bottom: auto; color: var(--amber); opacity: .9; font-size: clamp(.65rem, 2.3cqmin, 1.15rem); }
    #circle.model-sleek-analog .signature { top: 23%; bottom: auto; transform: translate(-50%, -50%); opacity: .65; }

    /* Bars */
    #circle.model-bars { background: var(--face-bg); }
    #circle.model-bars .digital-clock { top: 41%; font-size: clamp(1.8rem, 13.5cqmin, 5.2rem); }
    #circle.model-bars .digital-clock.h12 { font-size: clamp(1.4rem, 10.5cqmin, 4.1rem); }
    #circle.model-bars .digital-date { top: 12%; font-size: clamp(.6rem, 2.6cqmin, 1.15rem); }
    #circle.model-bars .precision-clock { top: 58%; bottom: auto; font-size: clamp(.55rem, 1.9cqmin, 1rem); }
    #circle.model-bars .tz-label { top: 21%; bottom: auto; font-size: clamp(.55rem, 1.8cqmin, .9rem); }
    #circle.model-bars .signature { bottom: 2.5%; }

    /* Sleek */
    #circle.model-sleek {
      --radius: 14px;
      background: var(--face-bg);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    #circle.model-sleek .digital-date {
      top: 19%; width: auto; white-space: nowrap;
      color: var(--amber); font-size: clamp(.9rem, 2.5cqmin, 1.3rem); font-weight: 500;
      letter-spacing: .14em;
    }
    #circle.model-sleek .digital-clock {
      top: 43%; font-size: clamp(3.6rem, 20cqmin, 9.5rem);
      color: var(--green); font-weight: 400; letter-spacing: -.02em;
      font-family: ui-monospace, 'SF Mono', 'Consolas', monospace;
    }
    #circle.model-sleek .digital-clock.h12 { font-size: clamp(2.8rem, 16cqmin, 7.6rem); }
    #circle.model-sleek .digital-clock .ms { display: inline; color: var(--precis); font-size: .52em; font-weight: 400; }
    #circle.model-sleek .digital-clock .period { color: var(--amber); font-size: .4em; font-weight: 500; margin-left: 8px; }

    /* Big Display */
    #circle.model-big-display {
      aspect-ratio: auto;
      width: 98vw;
      height: calc(100dvh - var(--chrome));
      border-radius: 12px;
      background: var(--face-bg);
    }
    #circle.model-big-display .digital-clock {
      top: 50%; font-size: min(17.5cqw, 54cqh); line-height: 1;
    }
    #circle.model-big-display .digital-clock.h12 { font-size: min(14.5cqw, 48cqh); }
    #circle.model-big-display .digital-clock .period { font-size: .28em; margin-left: .25em; color: var(--amber); }
    #circle.model-big-display .digital-date {
      top: 5%; left: 3%; transform: none; width: auto; text-align: left;
      font-size: max(.8rem, min(2.4cqw, 4.5cqh));
    }
    #circle.model-big-display .tz-label {
      top: 5%; bottom: auto; left: auto; right: 3%; transform: none; text-align: right; max-width: 40%;
      font-size: max(.75rem, min(2cqw, 4cqh)); color: var(--amber);
    }
    #circle.model-big-display .precision-clock {
      bottom: 4%; left: 3%; transform: none; text-align: left;
      font-size: max(.65rem, min(1.8cqw, 3.5cqh));
    }
    #circle.model-big-display .signature {
      bottom: 4%; left: auto; right: 3%; transform: none; text-align: right;
      font-size: max(.55rem, min(1.2cqw, 2.5cqh));
    }

    /* ── 7. UI: Settings & Status Bar ────────────────────────── */
    .settings-button {
      position: fixed; z-index: 5; top: 14px; right: 16px; width: 40px; height: 40px;
      border: 1px solid #334155; border-radius: 8px; background: rgba(15, 23, 42, 0.85);
      color: #e2e8f0; font-size: 18px; cursor: pointer;
    }
    .settings-button:hover { border-color: var(--green); color: var(--green); }

    .settings-panel {
      position: fixed; z-index: 6; top: 62px; right: 16px; width: min(360px, calc(100vw - 32px));
      max-height: calc(100vh - 78px); overflow-y: auto; padding: 16px 18px;
      border: 1px solid #334155; border-radius: 10px; background: rgba(10, 14, 18, 0.96); color: #f1f5f9;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
      font: 13px/1.4 system-ui, -apple-system, sans-serif;
    }
    .settings-panel[hidden] { display: none; }
    .settings-panel h2, .settings-panel h3 {
      margin: 0 0 10px; font-size: 12px; color: #94a3b8; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
    }
    .settings-panel h3 { margin-top: 16px; padding-top: 12px; border-top: 1px solid #1e293b; }

    .setting-row {
      display: grid; grid-template-columns: 1fr 1.15fr; align-items: center; gap: 10px; margin-top: 9px;
    }
    .setting-row.pulse-row { grid-template-columns: 1fr auto; }
    .setting-row label { color: #cbd5e1; font-size: 12px; }
    .setting-row select {
      width: 100%; min-width: 0; min-height: 32px; padding: 0 8px;
      border: 1px solid #334155; border-radius: 6px; background: #090d12; color: #f8fafc;
      font-size: 12px;
    }

    .world-settings-group[hidden] { display: none; }

    .pulse-toggle {
      appearance: none; position: relative; width: 38px; height: 22px; border-radius: 12px;
      background: #334155; cursor: pointer; transition: background .15s;
    }
    .pulse-toggle::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
      border-radius: 50%; background: #e2e8f0; transition: transform .15s;
    }
    .pulse-toggle:checked { background: #059669; }
    .pulse-toggle:checked::after { transform: translateX(16px); background: #fff; }

    .resync-button {
      margin-top: 14px; width: 100%; padding: 8px 10px; border: 1px solid #334155; border-radius: 6px;
      background: #111827; color: #e2e8f0; font: 600 12px system-ui, sans-serif; cursor: pointer;
    }
    .resync-button:hover { border-color: var(--green); color: var(--green); }
    .resync-button:disabled { opacity: .5; cursor: wait; }

    .live-status {
      position: fixed; z-index: 4; left: 0; right: 0; bottom: 10px; margin: 0 auto;
      width: fit-content; max-width: calc(100vw - 16px);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 10px;
      padding: 6px 12px; border: 1px solid var(--border-subtle); border-radius: 6px;
      background: var(--card-bg); color: #94a3b8;
      font: 11.5px/1.3 ui-monospace, 'SF Mono', monospace; font-variant-numeric: tabular-nums;
    }
    .status-main { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }
    .status-metrics { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px 10px; }
    .live-status i { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    .live-status i.ok   { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .live-status i.warn { background: var(--amber); }
    .live-status i.bad  { background: var(--red); }
    .live-status i.busy { background: var(--amber); animation: sync-pulse 1s ease-in-out infinite; }
    @keyframes sync-pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .live-status .metric b { font-weight: 600; }
    .live-status .metric b.q-excellent { color: var(--green); }
    .live-status .metric b.q-good      { color: var(--amber); }
    .live-status .metric b.q-weak      { color: var(--red); }
    .live-status .divider { color: #334155; }
    .status-metrics[hidden], .metric[hidden], .divider[hidden] { display: none; }

    /* ── 8. Responsive ───────────────────────────────────────── */
    @media (max-width: 820px) {
      #circle.model-world {
        aspect-ratio: auto;
        width: 94vw;
        height: calc(100dvh - var(--chrome));
      }
      #circle.model-world .world-master { flex: 0 0 30%; min-height: 0; }
      #circle.model-world .world-layout { gap: 8px; padding: 10px; }

      .world-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        flex: 1 1 auto;
        min-height: 0;
      }
      .world-card {
        min-height: 0;
        padding: 5px 4px;
      }
      .world-card-time { font-size: clamp(.85rem, 3.1cqmin, 1.35rem); }
      .world-card-meta { font-size: clamp(.48rem, 1.35cqmin, .68rem); }
    }
    @media (max-width: 600px) {
      :root { --chrome: 86px; --hour-hand-w: 4px; --min-hand-w: 3px; --sec-hand-w: 1.5px; }
      .clock-circle { width: min(96vmin, 96vw, calc(100dvh - var(--chrome))); }
      #circle:is(.model-bars, .model-sleek) {
        --ar-w: 4; --ar-h: 3; --rect-vw: 94vw; --rect-max: 600px;
      }
      .live-status .divider { display: none; }
      .live-status { font-size: 10.5px; padding: 5px 9px; }
    }
  </style>
</head>

        worldHubs: 'Ceasuri Globale (6 Fusuri)', masterStudio: 'STUDIO PRINCIPAL', sameTz: 'ORA STUDIO',
        resync: 'Resincronizează acum', searching: 'Căutare sursă de timp…', connecting: 'Conectare la sursa de timp…',
        receiving: 'Recepție date de timp…', calculating: 'Calculare offset ceas…',
        syncing: 'Resincronizare…', synced: 'Sincronizat', syncFailed: 'Resincronizare eșuată',
        noSource: 'Sursă indisponibilă', holdover: 'holdover', offset: 'offset', rtt: 'RTT',
        sources: 'surse', precision: 'precizie', disagree: 'Surse în dezacord',
        source: 'sursă', clockAhead: 'ceasul sistemului este', ahead: 'înainte', behind: 'înapoi', lastSync: 'ultima sinc'
      },
    };
    const LANG_ALIASES = { nb: 'no', nn: 'no' };

    /* ═══ 3. HELPERS ══════════════════════════════════════════ */
    const $ = id => document.getElementById(id);
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const trunc3 = s => String(s).replace(/(\.\d{3})\d+/, '$1');

    const store = {
      get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : v; } catch { return fallback; } },
      set(key, value)    { try { localStorage.setItem(key, value); } catch {} }
    };

    function detectLanguage() {
      const stored = store.get('masterclock-lang', '');
      if (I18N[stored]) return stored;
      for (const l of (navigator.languages || [navigator.language])) {
        const base = String(l || '').toLowerCase().split('-')[0];
        const code = LANG_ALIASES[base] || base;
        if (I18N[code]) return code;
      }
      return 'en';
    }

    function loadWorldZones() {
      try {
        const raw = store.get('masterclock-world-zones', '');
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length === 6) return parsed;
        // Migrate existing five-hub settings without losing the user's selections.
        if (Array.isArray(parsed) && parsed.length === 5) return [...parsed, DEFAULT_WORLD_ZONES[5]];
      } catch {}
      return [...DEFAULT_WORLD_ZONES];
    }

    function cityLabel(zoneId) {
      if (zoneId === 'UTC') return 'UTC';
      const parts = zoneId.split('/');
      return parts[parts.length - 1].replace(/_/g, ' ');
    }

    function getZoneOffsetMinutes(zoneId, dateObj) {
      if (zoneId === 'UTC') return 0;
      const dtf = new Intl.DateTimeFormat('en-US', {
        timeZone: zoneId,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false
      });
      const parts = {};
      for (const p of dtf.formatToParts(dateObj)) parts[p.type] = p.value;
      const asUtc = Date.UTC(
        Number(parts.year),
        Number(parts.month) - 1,
        Number(parts.day),
        Number(parts.hour) % 24,
        Number(parts.minute),
        Number(parts.second)
      );
      return Math.round((asUtc - dateObj.getTime()) / 60000);
    }

    function formatRelativeOffset(diffMinutes) {
      if (diffMinutes === 0) return t('sameTz');
      const sign = diffMinutes > 0 ? '+' : '−';
      const abs = Math.abs(diffMinutes);
      const h = Math.floor(abs / 60);
      const m = abs % 60;
      return m ? `${sign}${h}h${String(m).padStart(2, '0')}` : `${sign}${h}h`;
    }

    /* ═══ 4. DOM REFERENCES ═══════════════════════════════════ */
    const circle             = $('circle');
    const clkHms             = $('clkHms');
    const clkMs              = $('clkMs');
    const clkPeriod          = $('clkPeriod');
    const digitalClock       = $('digitalClock');
    const digitalDate        = $('digitalDate');
    const countdown          = $('countdown');
    const progressFill       = $('progressFill');
    const tzLabel            = $('tzLabel');
    const hourHandEl         = $('hourHand');
    const minuteHandEl       = $('minuteHand');
    const secondHandEl       = $('secondHand');
    const barsRow            = $('barsRow');
    const sleekDetails       = $('sleekDetails');
    const precisionTime      = $('precisionTime');
    const precisionPeriod    = $('precisionPeriod');

    const worldMasterBadge   = $('worldMasterBadge');
    const worldMasterZone    = $('worldMasterZone');
    const worldMasterHms     = $('worldMasterHms');
    const worldMasterMs      = $('worldMasterMs');
    const worldMasterPeriod  = $('worldMasterPeriod');
    const worldMasterDate    = $('worldMasterDate');
    const worldGrid          = $('worldGrid');
    const worldSettingsGroup = $('worldSettingsGroup');
    const worldHubSelects    = $('worldHubSelects');

    const settingsPanel      = $('settingsPanel');
    const settingsButton     = $('settingsButton');
    const modelSelect        = $('modelSelect');
    const themeSelect        = $('themeSelect');
    const languageSelect     = $('languageSelect');
    const timezoneSelect     = $('timezoneSelect');
    const hourFormatSelect   = $('hourFormatSelect');
    const pulseToggle        = $('pulseToggle');
    const resyncButton       = $('resyncButton');

    const syncDot            = $('syncDot');
    const syncText           = $('syncText');
    const offsetMetric       = $('offsetMetric');
    const precMetric         = $('precMetric');
    const rttMetric          = $('rttMetric');
    const divider            = $('divider');
    const statusMetrics      = $('statusMetrics');

    /* ═══ 5. STATE ════════════════════════════════════════════ */
    let language     = detectLanguage();
    let selectedZone = store.get('masterclock-timezone', 'UTC');
    let hourFormat   = store.get('masterclock-hourformat', '24');
    let pulseEnabled = store.get('masterclock-pulse', 'true') !== 'false';
    let model        = store.get('masterclock-model', 'room-control');
    let theme        = store.get('masterclock-theme', 'classic');
    let worldZones   = loadWorldZones();

    if (!MODELS.includes(model)) model = 'room-control';
    if (!THEMES.includes(theme)) theme = 'classic';

    let targetOffset   = null;
    let deviceOffsetMs = null;
    let lastRtt        = null;
    let lastUnc        = null;
    let lastSyncMono   = null;
    let syncing        = false;
    let syncTimer      = 0;
    let syncState      = { kind: '', key: 'searching', extra: '' };

    let tz = zone();
    let fmtTime = null, fmtDate = null;
    let worldFormatters = [];
    let worldCardsDom = [];
    let lastEpochSec = -1;
    let lastDateText = '';
    let clk = null;
    let themeColors = { green: '#00e676', amber: '#ffab00', red: '#ff1744' };

    const secondLeds = [];
    const hourLeds   = [];
    const bars       = [];

    const invalidate = () => { lastEpochSec = -1; };
    const t = key => (I18N[language] && I18N[language][key]) || I18N.en[key] || key;

    /* ═══ 6. APPLY SETTINGS ═══════════════════════════════════ */
    function refreshThemeColors() {
      const s = getComputedStyle(document.documentElement);
      themeColors = {
        green: s.getPropertyValue('--green').trim() || '#00e676',
        amber: s.getPropertyValue('--amber').trim() || '#ffab00',
        red:   s.getPropertyValue('--red').trim()   || '#ff1744'
      };
    }

    function applyTheme() {
      document.documentElement.dataset.theme = theme;
      refreshThemeColors();
      invalidate();
    }

    function applyModel() {
      circle.classList.remove(...MODELS.map(v => 'model-' + v));
      circle.classList.add('model-' + model);
      worldSettingsGroup.hidden = model !== 'world';
      invalidate();
    }

    function applyI18n() {
      document.documentElement.lang = language;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      settingsButton.setAttribute('aria-label', t('settings'));
      worldMasterBadge.textContent = t('masterStudio');
      updateStatusDisplay();
      updateMetrics();
    }

    function zone() {
      return selectedZone === 'DEVICE' ? Intl.DateTimeFormat().resolvedOptions().timeZone : selectedZone;
    }

    function rebuildFormatters() {
      tz = zone();
      const timeOpts = { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit' };
      if (hourFormat === '12') timeOpts.hour12 = true; else timeOpts.hourCycle = 'h23';
      fmtTime = new Intl.DateTimeFormat('en-GB', timeOpts);
      fmtDate = new Intl.DateTimeFormat(language, {
        timeZone: tz, weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric'
      });

      const cleanTz = tz.replace(/_/g, ' ');
      tzLabel.textContent = cleanTz;
      worldMasterZone.textContent = cleanTz;
      digitalClock.classList.toggle('h12', hourFormat === '12');

      worldFormatters = worldZones.map(wz => {
        const opts = { timeZone: wz, hour: '2-digit', minute: '2-digit', second: '2-digit' };
        if (hourFormat === '12') opts.hour12 = true; else opts.hourCycle = 'h23';
        return new Intl.DateTimeFormat('en-GB', opts);
      });

      worldCardsDom.forEach((card, idx) => {
        card.city.textContent = cityLabel(worldZones[idx]);
      });

      updateSleekDetails();
      invalidate();
    }

    /* ═══ 7. STATUS DISPLAY ═══════════════════════════════════ */
    function setSync(kind, key, extra = '') {
      syncState = { kind, key, extra };
      updateStatusDisplay();
    }

    function updateStatusDisplay() {
      syncDot.className = syncState.kind;
      syncText.textContent = t(syncState.key) + (syncState.extra ? ' · ' + syncState.extra : '');
      updateSleekDetails();
    }

    function updateSleekDetails() {
      if (deviceOffsetMs === null || lastUnc === null) {
        sleekDetails.innerHTML = `<span>${t(syncState.key)}</span>`;
        return;
      }
      const dir  = deviceOffsetMs >= 0 ? t('behind') : t('ahead');
      const off  = `${Math.round(Math.abs(deviceOffsetMs))} ms ${dir}`;
      const prec = `±${Math.round(lastUnc)} ms`;
      const when = new Date(performance.timeOrigin + lastSyncMono)
        .toLocaleTimeString(language, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      sleekDetails.innerHTML =
        `${t('source')}: <span>${syncState.extra || '—'}</span> · ${t('precision')} <span>${prec}</span><br>` +
        `${t('clockAhead')} <span>${off}</span> · ${t('lastSync')}: <span>${when}</span><br>` +
        `${t('timezone')}: <span>${tz.replace(/_/g, ' ')}</span>`;
    }

    function updateMetrics() {
      const show = deviceOffsetMs !== null && lastUnc !== null;
      divider.hidden       = !show;
      statusMetrics.hidden = !show;
      rttMetric.hidden     = !show || lastRtt === null;
      if (!show) return;

      const sign = deviceOffsetMs >= 0 ? '+' : '−';
      const absOff = Math.abs(deviceOffsetMs);
      const oq = absOff < 100 ? 'excellent' : absOff < 500 ? 'good' : 'weak';
      offsetMetric.innerHTML = `${t('offset')} <b class="q-${oq}">${sign}${Math.round(absOff)} ms</b>`;

      const pq = lastUnc < 50 ? 'excellent' : lastUnc < 200 ? 'good' : 'weak';
      precMetric.innerHTML = `${t('precision')} <b class="q-${pq}">±${Math.round(lastUnc)} ms</b>`;

      if (lastRtt !== null) {
        const q = lastRtt < 80 ? 'excellent' : lastRtt < 200 ? 'good' : 'weak';
        rttMetric.innerHTML = `${t('rtt')} <b class="q-${q}">${Math.round(lastRtt)} ms</b>`;
      }
      updateSleekDetails();
    }

    /* ═══ 8. TIME SYNC ════════════════════════════════════════ */
    const API_SOURCES = [
      {
        name: 'timeapi.io',
        url: 'https://timeapi.io/api/time/current/zone?timeZone=UTC',
        parse: j => Date.parse(trunc3(j.dateTime) + 'Z')
      },
      {
        name: 'worldtimeapi.org',
        url: 'https://worldtimeapi.org/api/timezone/Etc/UTC',
        parse: j => Date.parse(trunc3(j.utc_datetime))
      }
    ];

    async function syncApi(src) {
      let best = null;
      for (let i = 0; i < API_SAMPLES; i++) {
        const ctl = new AbortController();
        const to = setTimeout(() => ctl.abort(), REQUEST_TIMEOUT_MS);
        try {
          const t0 = performance.now();
          const r = await fetch(src.url, { cache: 'no-store', signal: ctl.signal });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const j = await r.json();
          const t1 = performance.now();
          const srv = src.parse(j);
          if (!Number.isFinite(srv)) throw new Error('parse');
          const rtt = t1 - t0;
          const s = { offset: srv - (t0 + rtt / 2), rttMin: rtt, unc: rtt / 2 + 1 };
          if (!best || s.unc < best.unc) best = s;
        } catch {}
        finally { clearTimeout(to); }
        if (i < API_SAMPLES - 1) await sleep(API_SAMPLE_GAP_MS);
      }
      if (!best) throw new Error('no samples from ' + src.name);
      return best;
    }

    const canUseHeaderFallback = () => location.protocol === 'http:' || location.protocol === 'https:';

    function marzullo(intervals) {
      const ev = [];
      for (const [lo, hi] of intervals) { ev.push([lo, 1]); ev.push([hi, -1]); }
      ev.sort((a, b) => a[0] - b[0] || b[1] - a[1]);
      let cnt = 0, best = 0, bLo = 0, bHi = 0;
      for (let i = 0; i < ev.length; i++) {
        cnt += ev[i][1];
        if (cnt > best) { best = cnt; bLo = ev[i][0]; bHi = ev[i + 1][0]; }
      }
      return { count: best, lo: bLo, hi: bHi };
    }

    async function syncDateHeader() {
      const iv = [];
      let method = 'HEAD';
      const base = location.href.split('#')[0].split('?')[0];
      for (let i = 0; i < HEADER_SAMPLES; i++) {
        try {
          const url = `${base}?_=${Math.random().toString(36).slice(2)}`;
          const sendMono = performance.now();
          const r = await fetch(url, { method, cache: 'no-store' });
          const recvMono = performance.now();
          if (!r.ok) {
            if (method === 'HEAD') { method = 'GET'; continue; }
            throw new Error('HTTP ' + r.status);
          }
          const d = r.headers.get('Date');
          const age = parseInt(r.headers.get('Age') || '0', 10);
          if (d && !age) {
            const D = Date.parse(d);
            if (Number.isFinite(D)) iv.push([D - recvMono, D + 1000 - sendMono]);
          }
        } catch {}
        await sleep(120 + Math.random() * 40);
      }
      if (iv.length < 3) throw new Error('no Date header');
      const m = marzullo(iv);
      if (m.count < Math.max(3, Math.ceil(iv.length * HEADER_MIN_AGREE))) throw new Error('inconsistent samples');
      return { offset: (m.lo + m.hi) / 2, rttMin: null, unc: (m.hi - m.lo) / 2 + 1 };
    }

    function scheduleNextSync() {
      clearTimeout(syncTimer);
      syncTimer = setTimeout(synchronize, syncState.kind === 'ok' ? RESYNC_OK_MS : RESYNC_WARN_MS);
    }

    async function synchronize() {
      if (syncing) return;
      syncing = true;
      resyncButton.disabled = true;
      setSync('busy', 'connecting');

      const results = [];
      for (const src of API_SOURCES) {
        setSync('busy', 'receiving', src.name);
        try {
          results.push(Object.assign(await syncApi(src), { name: src.name }));
        } catch {}
      }

      let res = null, label = '', agree = null;

      if (results.length) {
        setSync('busy', 'calculating');
        results.sort((a, b) => a.unc - b.unc);
        res = results[0];
        label = res.name;

        if (results.length > 1) {
          agree = results.slice(1).every(b => Math.abs(res.offset - b.offset) <= res.unc + b.unc);
          if (agree) label = `${results.length} ${t('sources')}`;
        }
      } else if (canUseHeaderFallback()) {
        setSync('busy', 'receiving', 'HTTP Date');
        try {
          res = await syncDateHeader();
          label = 'HTTP Date';
        } catch {}
      }

      if (res) {
        const now = performance.now();
        targetOffset   = res.offset;
        lastRtt        = res.rttMin;
        lastUnc        = res.unc;
        lastSyncMono   = now;
        deviceOffsetMs = (now + res.offset) - Date.now();

        if (agree === false) setSync('warn', 'disagree', label);
        else setSync(res.unc < GOOD_UNC_MS ? 'ok' : 'warn', 'synced', label);

        updateMetrics();
      } else {
        setSync(
          targetOffset === null ? 'bad' : 'warn',
          targetOffset === null ? 'noSource' : 'syncFailed',
          targetOffset === null ? '' : t('holdover')
        );
      }

      scheduleNextSync();
      syncing = false;
      resyncButton.disabled = false;
    }

    /* ═══ 9. DOM BUILD (LEDs, Bars, World Cards) ══════════════ */
    function addLeds(count, radius, cssClass, target) {
      const frag = document.createDocumentFragment();
      for (let i = 0; i < count; i++) {
        const deg = i * (360 / count);
        const a = (deg - 90) * Math.PI / 180;
        const led = document.createElement('span');
        led.className = cssClass;
        led.style.left = `${50 + radius * Math.cos(a)}%`;
        led.style.top  = `${50 + radius * Math.sin(a)}%`;
        led.style.setProperty('--rot', `${deg}deg`);
        frag.appendChild(led);
        target.push(led);
      }
      circle.appendChild(frag);
    }

    function buildWorldCards() {
      const frag = document.createDocumentFragment();
      for (let i = 0; i < 6; i++) {
        const card = document.createElement('div');
        card.className = 'world-card';

        const city = document.createElement('div');
        city.className = 'world-card-city';
        city.textContent = cityLabel(worldZones[i]);

        const time = document.createElement('div');
        time.className = 'world-card-time';
        time.textContent = '--:--:--';

        const meta = document.createElement('div');
        meta.className = 'world-card-meta';
        meta.textContent = 'UTC';

        card.append(city, time, meta);
        frag.appendChild(card);
        worldCardsDom.push({ city, time, meta });
      }
      worldGrid.appendChild(frag);
    }

    /* ═══ 10. RENDER LOOP ═════════════════════════════════════ */
    function onSecond(epochSec) {
      const date = new Date(epochSec * 1000);
      const p = {};
      for (const part of fmtTime.formatToParts(date)) p[part.type] = part.value;

      const sec = Number(p.second);
      clk = {
        hms:    `${p.hour}:${p.minute}:${p.second}`,
        suffix: p.dayPeriod ? p.dayPeriod.toUpperCase() : '',
        h12:    Number(p.hour) % 12,
        min:    Number(p.minute),
        sec,
        color:  sec >= 50 ? themeColors.red : sec >= 30 ? themeColors.amber : themeColors.green
      };

      clkHms.textContent    = clk.hms;
      clkPeriod.textContent = clk.suffix;

      const dateText = fmtDate.format(date);
      if (dateText !== lastDateText) {
        digitalDate.textContent = dateText;
        worldMasterDate.textContent = dateText;
        lastDateText = dateText;
      }

      countdown.textContent = String((60 - sec) % 60).padStart(2, '0');
      countdown.style.color = clk.color;
      progressFill.style.backgroundColor = clk.color;

      if (model === 'world') {
        worldMasterHms.textContent = clk.hms;
        worldMasterPeriod.textContent = clk.suffix;
        const studioOffsetMin = getZoneOffsetMinutes(tz, date);

        for (let i = 0; i < 6; i++) {
          const wz = worldZones[i];
          const wp = {};
          for (const part of worldFormatters[i].formatToParts(date)) wp[part.type] = part.value;
          const suf = wp.dayPeriod ? ` ${wp.dayPeriod.toUpperCase()}` : '';
          worldCardsDom[i].time.textContent = `${wp.hour}:${wp.minute}:${wp.second}${suf}`;

          const hubOffsetMin = getZoneOffsetMinutes(wz, date);
          const relDiff = hubOffsetMin - studioOffsetMin;
          const utcHours = hubOffsetMin / 60;
          const utcStr = utcHours === 0 ? 'UTC' : `UTC${utcHours > 0 ? '+' : '−'}${Math.abs(utcHours)}`;
          worldCardsDom[i].meta.textContent = `${formatRelativeOffset(relDiff)} · ${utcStr}`;
        }
      }

      updateIndicators(sec);
    }

    function updateIndicators(sec) {
      if (ANALOG_MODELS.has(model)) {
        secondLeds.forEach((led, i) => {
          led.classList.toggle('on', i === sec);
          led.classList.remove('pulse-last10');
        });
        hourLeds.forEach((led, i) => led.classList.toggle('on', i === clk.h12));
      } else if (model === 'room-control') {
        secondLeds.forEach((led, i) => {
          const on = i <= sec;
          led.classList.toggle('on', on);
          led.classList.toggle('pulse-last10', pulseEnabled && on && sec >= 50);
        });
        const litHours = Math.floor(sec / 5);
        hourLeds.forEach((led, i) => led.classList.toggle('on', i <= litHours));
      } else if (model === 'bars') {
        bars.forEach((bar, i) => {
          bar.classList.toggle('on', i <= sec);
          bar.classList.toggle('last10', pulseEnabled && sec >= 50 && i >= 50);
        });
      }
    }

    function render() {
      requestAnimationFrame(render);
      if (targetOffset === null) return;

      const now   = performance.now();
      const utcMs = now + targetOffset;
      const epoch = Math.floor(utcMs / 1000);
      if (epoch !== lastEpochSec) { lastEpochSec = epoch; onSecond(epoch); }

      const ms     = Math.floor(utcMs - epoch * 1000);
      const msText = String(ms).padStart(3, '0');
      const s      = clk.sec + ms / 1000;

      if (model === 'sleek') {
        clkMs.textContent = '.' + msText;
      } else if (model === 'world') {
        worldMasterMs.textContent = '.' + msText;
      } else {
        precisionTime.textContent = `${clk.hms}.${msText}`;
        precisionPeriod.textContent = clk.suffix;
      }

      if (model === 'room-control') {
        progressFill.style.width = `${(s / 60) * 100}%`;
      }

      if (ANALOG_MODELS.has(model)) {
        hourHandEl.style.transform   = `rotate(${(clk.h12 + clk.min / 60) * 30}deg)`;
        minuteHandEl.style.transform = `rotate(${(clk.min + s / 60) * 6}deg)`;
        secondHandEl.style.transform = `rotate(${s * 6}deg)`;
      }
    }

    /* ═══ 11. INIT & EVENTS ═══════════════════════════════════ */
    const zones = Intl.supportedValuesOf ? Intl.supportedValuesOf('timeZone') : [];
    for (const z of zones) {
      if (z === 'UTC') continue;
      const opt = document.createElement('option');
      opt.value = opt.textContent = z;
      timezoneSelect.appendChild(opt);
    }
    if (selectedZone !== 'UTC' && selectedZone !== 'DEVICE' && !zones.includes(selectedZone)) selectedZone = 'UTC';

    // Populate 6 World Hub selectors in Settings
    for (let i = 0; i < 6; i++) {
      const row = document.createElement('div');
      row.className = 'setting-row';
      const lbl = document.createElement('label');
      lbl.textContent = `Hub ${i + 1}`;
      const sel = document.createElement('select');

      const utcOpt = document.createElement('option');
      utcOpt.value = utcOpt.textContent = 'UTC';
      sel.appendChild(utcOpt);

      for (const z of zones) {
        if (z === 'UTC') continue;
        const opt = document.createElement('option');
        opt.value = z;
        opt.textContent = z.replace(/_/g, ' ');
        sel.appendChild(opt);
      }

      if (!zones.includes(worldZones[i]) && worldZones[i] !== 'UTC') worldZones[i] = DEFAULT_WORLD_ZONES[i];
      sel.value = worldZones[i];

      sel.addEventListener('change', () => {
        worldZones[i] = sel.value;
        store.set('masterclock-world-zones', JSON.stringify(worldZones));
        rebuildFormatters();
      });

      row.append(lbl, sel);
      worldHubSelects.appendChild(row);
    }

    timezoneSelect.value   = selectedZone;
    languageSelect.value   = language;
    hourFormatSelect.value = hourFormat;
    pulseToggle.checked    = pulseEnabled;
    modelSelect.value      = model;
    themeSelect.value      = theme;

    addLeds(60, 40, 'led', secondLeds);
    addLeds(12, 47, 'hour-led', hourLeds);
    buildWorldCards();

    {
      const frag = document.createDocumentFragment();
      for (let i = 0; i < 60; i++) {
        const bar = document.createElement('span');
        bar.className = 'bar' + (i % 5 === 0 ? ' hour-mark' : '');
        frag.appendChild(bar);
        bars.push(bar);
      }
      barsRow.appendChild(frag);
    }

    applyTheme();
    applyModel();
    rebuildFormatters();
    applyI18n();

    function setPanel(open) {
      settingsPanel.hidden = !open;
      settingsButton.setAttribute('aria-expanded', String(open));
    }
    settingsButton.addEventListener('click', () => setPanel(settingsPanel.hidden));
    document.addEventListener('click', e => {
      if (!settingsPanel.hidden && !settingsPanel.contains(e.target) && !settingsButton.contains(e.target)) setPanel(false);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setPanel(false); });

    modelSelect.addEventListener('change', () => {
      model = modelSelect.value;
      store.set('masterclock-model', model);
      applyModel();
    });
    themeSelect.addEventListener('change', () => {
      theme = themeSelect.value;
      store.set('masterclock-theme', theme);
      applyTheme();
    });
    languageSelect.addEventListener('change', () => {
      language = languageSelect.value;
      store.set('masterclock-lang', language);
      applyI18n();
      rebuildFormatters();
    });
    timezoneSelect.addEventListener('change', () => {
      selectedZone = timezoneSelect.value;
      store.set('masterclock-timezone', selectedZone);
      rebuildFormatters();
    });
    hourFormatSelect.addEventListener('change', () => {
      hourFormat = hourFormatSelect.value;
      store.set('masterclock-hourformat', hourFormat);
      rebuildFormatters();
    });
    pulseToggle.addEventListener('change', () => {
      pulseEnabled = pulseToggle.checked;
      store.set('masterclock-pulse', String(pulseEnabled));
      invalidate();
    });
    resyncButton.addEventListener('click', () => synchronize());

    document.addEventListener('visibilitychange', () => {
      if (document.hidden || targetOffset === null || syncing) return;
      const drift = (performance.now() + targetOffset) - Date.now() - deviceOffsetMs;
      if (Math.abs(drift) > WAKE_DRIFT_MS) synchronize();
    });

    render();
    synchronize();
  </script>
</body>
</html>
