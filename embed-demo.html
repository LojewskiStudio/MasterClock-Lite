<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MasterClock Lite – Integration Demo</title>

<style>
:root {
    color-scheme: dark;
    --accent: #ff8400;
    --background: #111;
    --panel: #1c1c1c;
    --item: #0e0e0e;
    --border: #333;
    --text: #aaaaaa;
    --sig:  #b62a70;
    --muted: #e28e49;
    --value: #72afa2;
}

* {
    box-sizing: border-box;
}
body {
    margin: 0;
    padding: clamp(1rem, 3vw, 2rem);
    background: var(--background);
    font-family: Arial, sans-serif;
}
.container {
    width: 100%;
    max-width: 68.75rem;
    margin-inline: auto;
}

/* HEADER */
h1 {
    margin: 0 0 0.5rem;
    color: var(--accent);
    font-size: clamp(1.4rem, 3vw, 1.8rem);
    text-align: center;
}
.subtitle {
    margin-bottom: 1.5rem;
    color: var(--sig);
    font-size: 0.7rem;
    text-align: center;
}

/* CLOCK */
.clock-frame {
    display: block;
    width: 100%;
    height: clamp(30rem, 65vh, 36rem);
    border: 1px solid var(--border);
    background: #000;
}

/* MONITOR PANEL */
.panel {
    margin-top: 1.25rem;
    padding: clamp(0.75rem, 2vw, 1.25rem);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
}
.status {
    margin-bottom: 1rem;
    color: var(--text);
    font-size: 0.8rem;
}

/* DATA GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(min(100%, 10rem), 1fr)
    );
    gap: 0.9rem;
}
.item {
    min-width: 0;
    padding: 0.45rem;
    background: var(--item);
    border-radius: 0.25rem;
    border: 1px solid var(--border);
}
.label {
    margin-bottom: 0.5rem;
    color: var(--muted);
    font-size: 0.75rem;
    text-align: center;
}
.value {
    color: var(--value);
    font-family: monospace;
    font-size: 0.7rem;
    text-align: center;
    overflow-wrap: anywhere;
}

/* FOOTER */
.footer {
    margin-top: 1.5rem;
    color:  var(--sig);
    font-size: 0.75rem;
    text-align: center;
}

/* SMALL SCREENS */
@media (max-width: 480px) {
    body {
        padding: 1rem;
    }
    .clock-frame {
        height: 30rem;
    }
    .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.6rem;
    }

}
</style>
</head>

<body>
<div class="container">
    <h1>MasterClock Lite</h1>
    <div class="subtitle">
       *** postMessage protocol / version 1 (demo) ***
    </div>
    <!-- MASTER CLOCK -->
    <iframe
        id="clock"
        class="clock-frame"
        title="MasterClock Lite"
        allow="screen-wake-lock"
    ></iframe>
    <!-- INTEGRATION MONITOR -->
    <div class="panel">
        <div class="status" id="connection">
            Waiting for connection...
        </div>
        <div class="grid">
            <div class="item">
                <div class="label">Synchronized Time</div>
                <div class="value" id="time">--</div>
            </div>
            <div class="item">
                <div class="label">Sync State</div>
                <div class="value" id="state">--</div>
            </div>
            <div class="item">
                <div class="label">Accuracy</div>
                <div class="value" id="accuracy">--</div>
            </div>
            <div class="item">
                <div class="label">Time Source</div>
                <div class="value" id="source">--</div>
            </div>
            <div class="item">
                <div class="label">Holdover</div>
                <div class="value" id="holdover">--</div>
            </div>
            <div class="item">
                <div class="label">Sequence</div>
                <div class="value" id="sequence">--</div>
            </div>
        </div>
    </div>
    <!-- FOOTER -->
    <div class="footer">
      MasterClock Lite ver.01 / Lojewski Studio - 2026
    </div>
</div>
<script>
(() => {
    'use strict';
// CONFIGURATION
    const CLOCK_ORIGIN = 'https://lojewskistudio.github.io';
    const CLOCK_URL =
        CLOCK_ORIGIN + '/MasterClock-Lite/';
    const PROTOCOL_VERSION = 1;
// ELEMENTS
    const frame = document.getElementById('clock');
    const connection =
        document.getElementById('connection');
    const timeElement =
        document.getElementById('time');
    const stateElement =
        document.getElementById('state');
    const accuracyElement =
        document.getElementById('accuracy');
    const sourceElement =
        document.getElementById('source');
    const holdoverElement =
        document.getElementById('holdover');
    const sequenceElement =
        document.getElementById('sequence');
// CONNECTION STATE
    let ready = false;
    let helloTimer = null;
// PIN THE PERMITTED PARENT ORIGIN
    const parentOrigin = window.location.origin;
    if (parentOrigin === 'null') {
        connection.textContent =
            'Error: Open this demo through HTTPS or HTTP, not file://';
        return;
    }
// BUILD CLOCK URL
    const clockUrl = new URL(CLOCK_URL);
    clockUrl.searchParams.set('embed', 'true');
    clockUrl.searchParams.set(
        'parentOrigin',
        parentOrigin
    );
// HANDSHAKE
    function sendHello() {
        if (!frame.contentWindow || ready) return;
        frame.contentWindow.postMessage({
            type: 'MASTERclock_HELLO',
            version: PROTOCOL_VERSION
        }, CLOCK_ORIGIN);
    }
    function startHandshake() {
        clearInterval(helloTimer);
        ready = false;
        connection.textContent =
            'Connecting to MasterClock Lite...';
        sendHello();
// Repeat HELLO until READY is received.
        helloTimer = setInterval(() => {
            if (!ready) {
                sendHello();
            }
        }, 500);
    }
// LISTEN FOR IFRAME LOAD
    frame.addEventListener('load', startHandshake);
// RECEIVE MESSAGES
    window.addEventListener('message', event => {
// SECURITY VALIDATION
        if (event.origin !== CLOCK_ORIGIN) return;
        if (event.source !== frame.contentWindow) return;
        const data = event.data;
        if (!data || typeof data !== 'object') return;
        if (data.version !== PROTOCOL_VERSION) return;
// MASTER CLOCK READY
        if (data.type === 'MASTERclock_READY') {
            ready = true;
            clearInterval(helloTimer);
            connection.textContent =
                'Connected · Updates every ' +
                data.intervalMs + ' ms';
            return;
        }
// IGNORE UNEXPECTED MESSAGES
        if (data.type !== 'MASTERclock_TIME') return;
// SYNCHRONIZED TIME
        timeElement.textContent =
            typeof data.unixMs === 'number'
                ? new Date(data.unixMs).toISOString()
                : 'Unavailable';
// SYNCHRONIZATION STATE
        stateElement.textContent =
            data.syncState ?? '--';
// ACCURACY
        accuracyElement.textContent =
            typeof data.accuracyMs === 'number'
                ? '±' + data.accuracyMs + ' ms'
                : 'Unknown';
// TIME SOURCE
        sourceElement.textContent =
            data.source ?? '--';
// HOLDOVER
        holdoverElement.textContent =
            data.holdover
                ? 'Active · ' +
                    (typeof data.holdoverAgeMs === 'number'
                        ? Math.round(data.holdoverAgeMs / 1000) + ' s'
                        : 'Age unknown')
                : 'Inactive';
// MESSAGE SEQUENCE
        sequenceElement.textContent =
            data.seq ?? '--';
    });
// CLEANUP
    window.addEventListener('pagehide', () => {
        clearInterval(helloTimer);
    });
// START CLOCK
    frame.src = clockUrl.toString();
  })();
</script>

</body>
</html>
